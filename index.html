<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My_3D_game</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a
      href="saltline.html"
      style="position:fixed;z-index:9;top:12px;left:12px;padding:8px 14px;
             background:rgba(6,9,15,.82);color:#dfe7f2;border:1px solid #2b3a4d;
             border-radius:6px;font:600 12px/1 ui-monospace,monospace;
             letter-spacing:.18em;text-decoration:none"
      >PLAY SALT LINE &rarr;</a
    >
    <a-scene>
      <a-assets>
        <a-asset-item
          id="mymodel"
          src="Housefora-framethingy (2).glb"
        ></a-asset-item>
      </a-assets>
      <a-entity gltf-model="#mymodel" position="0 1 -3" scale="100 100 100">
      </a-entity>
      <a-sky color="#87CEEB"></a-sky>
      <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="100"
        height="100"
        color="#4CAF50"
      >
      </a-plane>
    </a-scene>
  </body>
</html>
