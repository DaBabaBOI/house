<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SALT LINE — a two-player duel</title>
<style>
  :root{
    --bg:#06090f;
    --ink:#dfe7f2;
    --dim:#7b8899;
    --edge:#1b2735;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;image-rendering:auto;background:#06090f;
    box-shadow:0 0 0 1px #16202c, 0 24px 80px rgba(0,0,0,.8);}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    padding:6vh 6vw;background:radial-gradient(ellipse at 50% 40%, rgba(8,12,20,.86), rgba(4,6,10,.97));
    backdrop-filter:blur(2px);overflow:auto;}
  #overlay.on{display:flex;}
  .card{max-width:760px;width:100%;animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .kicker{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-bottom:18px;}
  h1{font-size:clamp(44px,9vw,96px);line-height:.92;margin:0 0 10px;letter-spacing:.06em;font-weight:500;}
  h2{font-size:clamp(24px,4vw,38px);line-height:1.1;margin:0 0 18px;font-weight:500;letter-spacing:.02em;}
  p{font-size:clamp(15px,1.9vw,19px);line-height:1.62;margin:0 0 14px;color:#c3cedd;max-width:62ch;}
  p.speaker{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.28em;
    text-transform:uppercase;color:var(--dim);margin-bottom:12px;}
  .hint{margin-top:28px;font:500 13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em;color:var(--dim);text-transform:uppercase;}
  .hint b{color:var(--ink);font-weight:600;}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:26px 0 0;
    font:500 13px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;}
  .keys section{border-top:1px solid var(--edge);padding-top:12px;}
  .keys h3{margin:0 0 8px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.28em;text-transform:uppercase;}
  .keys dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;color:#a9b6c7;}
  .keys dt{color:#e8eef7;}
  kbd{display:inline-block;border:1px solid #2b3a4d;border-bottom-width:2px;border-radius:4px;
    padding:1px 6px;background:#0e1720;color:#e8eef7;font:600 12px/1.5 ui-monospace,monospace;}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--edge),transparent);margin:26px 0;}
  .rows{display:flex;flex-direction:column;gap:9px;margin:24px 0 4px;}
  .row{display:grid;grid-template-columns:26px 1fr auto;align-items:baseline;gap:16px;
    width:100%;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;
    background:rgba(14,23,32,.8);border:1px solid #223246;border-radius:8px;padding:13px 16px;
    transition:background .12s,border-color .12s;}
  .row:hover,.row.on{background:#17293c;border-color:#456e96;}
  .row .n{font:600 11px ui-monospace,monospace;color:var(--dim);}
  .row .t{font-size:17px;line-height:1.3;}
  .row .h{font:500 11px ui-monospace,monospace;color:var(--dim);letter-spacing:.06em;text-align:right;}
  .row.on .n,.row.on .h{color:#b9c8da;}
  .go{margin:22px 0 0;cursor:pointer;font:600 13px/1 ui-monospace,monospace;letter-spacing:.18em;
    background:#1b3350;color:#eaf1f9;border:1px solid #47709a;border-radius:8px;padding:13px 26px;}
  .go:hover{background:#25456a;}
  @media (max-width:640px){ .row{grid-template-columns:22px 1fr;} .row .h{grid-column:2;text-align:left;} }
  .blink{animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.card,.blink{animation:none;}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="overlay"></div>
</div>
<script>
"use strict";
/* ============================================================
   SALT LINE — a two-player mirror duel, local or online.

   Design rule: nothing in the simulation is random. Every
   outcome comes from positioning, aim, timing, and reading
   your opponent. Math.random is used for spark particles only,
   and those touch nothing that decides a round.
   ============================================================ */

const W = 1920, H = 1200;          // the world
const VW = 960, VH = 600;          // what fits on screen at rest
const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d");
const overlay = document.getElementById("overlay");

/* The simulation always thinks in a 960x600 field; the canvas is scaled
   to whatever room the window has, at device pixel density. */
let viewScale = 1;
function fitCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min((innerWidth - 32) / VW, (innerHeight - 32) / VH);
  viewScale = Math.max(0.4, s);
  cvs.style.width  = (VW * viewScale) + "px";
  cvs.style.height = (VH * viewScale) + "px";
  cvs.width  = Math.round(VW * viewScale * dpr);
  cvs.height = Math.round(VH * viewScale * dpr);
  viewScale *= dpr;
}

/* The camera holds every living keeper in frame, pulling back when they
   spread out and closing in when the duel tightens. */
const CAM = { x:W/2, y:H/2, zoom:1, tx:W/2, ty:H/2, tz:1 };
const CAM_MIN = 0.42, CAM_MAX = 1.0;

function updateCamera(g, dt){
  const watched = g.alive.length ? g.alive : g.players;
  let x0=1e9, y0=1e9, x1=-1e9, y1=-1e9;
  for (const p of watched){
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
  }
  for (const m of g.motes){            // keep live motes in shot where cheap
    x0 = Math.min(x0, m.x); x1 = Math.max(x1, m.x);
    y0 = Math.min(y0, m.y); y1 = Math.max(y1, m.y);
  }
  const pad = 190;
  const bw = (x1-x0) + pad*2, bh = (y1-y0) + pad*2;
  CAM.tz = clamp(Math.min(VW/bw, VH/bh), CAM_MIN, CAM_MAX);
  CAM.tx = (x0+x1)/2; CAM.ty = (y0+y1)/2;

  const halfW = VW/(2*CAM.tz), halfH = VH/(2*CAM.tz);
  CAM.tx = halfW*2 >= W ? W/2 : clamp(CAM.tx, halfW, W-halfW);
  CAM.ty = halfH*2 >= H ? H/2 : clamp(CAM.ty, halfH, H-halfH);

  const k = 1 - Math.exp(-6*dt);      // ease, so it never snaps
  CAM.zoom += (CAM.tz - CAM.zoom)*k;
  CAM.x    += (CAM.tx - CAM.x)*k;
  CAM.y    += (CAM.ty - CAM.y)*k;
}
function camReset(g){
  updateCamera(g, 1);
  CAM.zoom = CAM.tz; CAM.x = CAM.tx; CAM.y = CAM.ty;
}
addEventListener("resize", fitCanvas);
fitCanvas();

/* ---------- shared tuning ---------- */
const BASE = {
  accel:3000, maxSpeed:330, friction:9.0, radius:13,
  dashSpeed:940, dashTime:0.17, dashCd:1.25,
  ammo:3, fireCd:0.22, reload:0.9,
  moteSpeed:470, moteRadius:5, moteBounces:5, moteLife:8.0, armTime:0.45,
  parryTime:0.14, parryCd:0.9, parryReach:38, parryArc:Math.PI*0.62, returnSpeed:600,
  bounceGain:1,                      // velocity multiplier applied on each bounce
};

const ROUND_TIME  = 45;    // seconds before the dark starts closing
const CLOSE_STEP  = 1.25;
const CLOSE_AMOUNT= 46;
const WINS_NEEDED = 3;      // the duel: first to three rounds
const WINS_BR     = 2;      // battle royale: first to two rounds
const MAX_SEATS   = 6;

/* Charge is earned by skill, never by waiting: parries, keeping your own
   motes alive off the walls, and slipping past a live one. */
const CHG_FULL   = 100;
const CHG_PARRY  = 45;
const CHG_BOUNCE = 10;     // per bounce of a mote you own, first 3 only
const CHG_MISS   = 20;     // an armed mote passes close and does not hit you

/* ============================================================
   THE KEEPERS
   Each holds a different tower and a different mirror-craft.
   ============================================================ */
const CHARS = [
  { id:"ines", name:"INES", title:"The Lampwright", color:"#ffb347",
    passive:"Steady hand — motes fly faster, and spent shots come back sooner.",
    special:"SECOND WICK", specialText:"Fires three motes in a tight fan.",
    ending:"keeps the wick trimmed so low it burns a hundred years on nothing.",
    stats:{ moteSpeed:520, reload:0.6 } },

  { id:"cato", name:"CATO", title:"The Tidewatcher", color:"#7fe8ff",
    passive:"Undertow — a longer, faster dash on a shorter leash.",
    special:"EBB", specialText:"Snap back to where you stood a moment ago.",
    ending:"learns the tide so well the tide starts keeping time by her.",
    stats:{ dashSpeed:1080, dashTime:0.20, dashCd:0.95 } },

  { id:"meran", name:"MERAN", title:"The Glassblower", color:"#9df5c0",
    passive:"Annealed — a wide guard that recovers fast, but only two motes.",
    special:"PRISM", specialText:"Your next mote splits in three on its first wall.",
    ending:"blows a lens so true the beam reaches the far shore, and is answered.",
    stats:{ ammo:2, parryArc:Math.PI*0.92, parryCd:0.6, parryReach:44 } },

  { id:"odall", name:"ODALL", title:"The Wrecker", color:"#ff8a6b",
    passive:"Heavy glass — slow, fat motes that ride the walls far longer.",
    special:"BREAKWATER", specialText:"Raise a wall of slag in front of you.",
    ending:"pulls the dead ships off the rocks one winter at a time, and stops counting.",
    stats:{ maxSpeed:292, accel:2700, moteSpeed:375, moteRadius:9, moteBounces:9, moteLife:10 } },

  { id:"silt", name:"SILT", title:"The Mudlark", color:"#c9d66b",
    passive:"Small — a smaller target and quicker feet, but a slower trigger.",
    special:"DUCK UNDER", specialText:"Light passes through you. No shooting, no guard.",
    ending:"goes on finding things in the mud that the flood was supposed to have kept.",
    stats:{ radius:10, maxSpeed:372, accel:3300, fireCd:0.42, reload:1.15 } },

  { id:"vane", name:"VANE", title:"The Signalman", color:"#c4a6ff",
    passive:"Long focus — motes live longer and gather speed off every wall.",
    special:"RECALL", specialText:"Every mote you own turns around where it is.",
    ending:"sends one message a year to a coast that has nobody left to read it.",
    stats:{ moteLife:12, moteBounces:6, bounceGain:1.085 } },

  { id:"keel", name:"KEEL", title:"The Bellringer", color:"#8fb6d9",
    passive:"Toll — parried motes come off the mirror hard, on a tighter window.",
    special:"RINGING", specialText:"A ring of sound throws every mote away from you.",
    ending:"rings the hours for a town that drowned, because the hours still pass.",
    stats:{ parryTime:0.105, returnSpeed:845, parryCd:0.8 } },

  { id:"auger", name:"AUGER", title:"The Welldigger", color:"#e0c36a",
    passive:"Dowser — you see the line your shot will take, two walls ahead.",
    special:"SINKHOLE", specialText:"Open a hole in the floor that drinks light.",
    ending:"digs down past the door under the cistern and does not write what is there.",
    stats:{ moteSpeed:450, fireCd:0.26 } },
];
CHARS.forEach(c => c.st = Object.assign({}, BASE, c.stats));

const DEFAULT_PICKS = [0, 1, 2, 3, 4, 5];   // Ines and Cato hold the tower in the story
let SEAT_COUNT = 2;                         // keepers in this match
let MY_SEAT = 0;                            // which seat this browser drives
const isBR = () => SEAT_COUNT > 2;

/* ---------- arenas (all 180deg-rotationally symmetric: no side has an edge) ---------- */
const ARENAS = [
  { name:"The Lamp Room",
    walls:[ {x:860,y:550,w:200,h:100},
            {x:300,y:240,w:80,h:280},   {x:1540,y:680,w:80,h:280},
            {x:700,y:180,w:220,h:40},   {x:1000,y:980,w:220,h:40} ],
    spawns:[[560,600],[1360,600]] },

  { name:"The Cistern",
    walls:[ {x:480,y:280,w:240,h:80},   {x:1200,y:840,w:240,h:80},
            {x:480,y:840,w:240,h:80},   {x:1200,y:280,w:240,h:80},
            {x:200,y:560,w:60,h:80},    {x:1660,y:560,w:60,h:80},
            {x:840,y:520,w:240,h:160, void:true} ],
    spawns:[[480,360],[1440,840]] },

  { name:"The Salt Line",
    walls:[ {x:400,y:400,w:1120,h:48},  {x:400,y:752,w:1120,h:48},
            {x:160,y:560,w:48,h:80},    {x:1712,y:560,w:48,h:80},
            {x:860,y:180,w:200,h:40},   {x:860,y:980,w:200,h:40} ],
    spawns:[[420,260],[1500,940]] },

  { name:"The Door Below",
    walls:[ {x:600,y:200,w:80,h:360},   {x:1240,y:640,w:80,h:360},
            {x:1240,y:200,w:80,h:200},  {x:600,y:800,w:80,h:200},
            {x:280,y:760,w:240,h:48},   {x:1400,y:392,w:240,h:48},
            {x:880,y:540,w:160,h:120, void:true} ],
    spawns:[[520,600],[1400,600]] },

  { name:"One Light",
    walls:[ {x:760,y:360,w:80,h:80},    {x:1080,y:760,w:80,h:80},
            {x:1080,y:360,w:80,h:80},   {x:760,y:760,w:80,h:80},
            {x:120,y:480,w:48,h:240},   {x:1752,y:480,w:48,h:240},
            {x:860,y:120,w:200,h:48},   {x:860,y:1032,w:200,h:48} ],
    spawns:[[480,320],[1440,880]] },
];

/* ---------- story ----------
   The logs belong to whoever is holding each seat, so they name nobody. */
const BEATS = [
  { head:"Dusk, the first night", who:0, lines:[
    "The lamp takes one keeper. The Order was clear about that, and the Order is thirty years drowned, so the rule is only habit now. Habit is most of what holds this coast together.",
    "So we do it the old way. Mirrors, at dusk, until one of us can't stand. The loser walks the salt line inland at low tide and does not come back.",
    "I packed the other bag this morning. They'll call that arrogance. It's just hope that I won't have to hand it over." ]},

  { head:"The ledger", who:1, lines:[
    "The one across the room fights like the tower is already theirs. It isn't.",
    "I counted the oil tonight because I couldn't sleep. Nineteen drums in the ledger. Eleven in the cellar. Someone has been burning it somewhere that isn't up here.",
    "The lamp doesn't drink that much. Nothing above the waterline does." ]},

  { head:"Under the cistern", who:0, lines:[
    "There is a door below the cistern with the first keeper's mark cut into it, and warmth coming through the gap at the bottom.",
    "Warm. In a flooded cellar. In February.",
    "I put my hand flat against it and something on the other side went quiet. Not away — quiet. The way you go quiet when you're listening for someone to do it again." ]},

  { head:"What the Order actually wrote", who:1, lines:[
    "Found it water-stained at the back of the log, in a hand older than the flood:",
    "“The light is not for the ships. Keep it lit and keep it single. Two lights wake it.”",
    "That's the duel. Not the honour of the tower, not the lineage, none of the things we were told to be proud of. If we both stayed we would both keep lamps, and then —" ]},

  { head:"The last dusk", who:0, lines:[
    "So it was never a prize. It was a way of rationing us.",
    "Whoever wins tonight sits alone above that door for the rest of their life. Whoever loses gets the road, and the road is the mercy.",
    "Funny, how many years I spent trying to win." ]},
];

const ROUND_FLAVOR = [
  "the mirror holds",
  "a clean line",
  "read, and answered",
  "one lamp, one keeper",
  "the coast goes dark for a breath",
];

/* ============================================================
   INPUT
   ============================================================ */
const held = new Set(), edge = new Set();
const BLOCK = new Set(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight",
                       "Slash","Period","Comma","Semicolon","KeyQ","KeyE","KeyF"]);

const typing = e => {
  const t = e.target;
  return t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT");
};
addEventListener("keydown", e => {
  if (typing(e)){ if (e.code === "Escape") { held.add(e.code); edge.add(e.code); } return; }
  if (BLOCK.has(e.code)) e.preventDefault();
  if (e.repeat) return;
  held.add(e.code); edge.add(e.code);
}, {passive:false});
addEventListener("keyup", e => held.delete(e.code));
addEventListener("blur", () => { held.clear(); edge.clear(); });

const hasHeld = k => Array.isArray(k) ? k.some(x => held.has(x)) : held.has(k);
const hasEdge = k => Array.isArray(k) ? k.some(x => edge.has(x)) : edge.has(k);

const SCHEMES = [
  { up:"KeyW", down:"KeyS", left:"KeyA", right:"KeyD",
    fire:"Space", parry:"KeyQ", dash:"KeyE", special:["KeyF","KeyR"] },
  { up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight",
    fire:"Period", parry:"Comma", dash:"Slash", special:["Semicolon","ShiftRight","Numpad0"] },
];

function blankInput(){
  return {ax:0, ay:0, fire:false, parry:false, dash:false, special:false, confirm:false, back:false};
}

function readInput(schemeIndex){
  const s = SCHEMES[schemeIndex], i = blankInput();
  if (hasHeld(s.left))  i.ax -= 1;
  if (hasHeld(s.right)) i.ax += 1;
  if (hasHeld(s.up))    i.ay -= 1;
  if (hasHeld(s.down))  i.ay += 1;
  i.fire    = hasEdge(s.fire);
  i.parry   = hasEdge(s.parry);
  i.dash    = hasEdge(s.dash);
  i.special = hasEdge(s.special);
  i.confirm = i.fire || edge.has("Enter");
  i.back    = i.parry;
  return i;
}
// Either player may advance a story card in local play.
function anyConfirm(){
  if (UI_CONFIRM){ UI_CONFIRM = false; return true; }
  return edge.has("Space") || edge.has("Enter") || edge.has("Period");
}

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function len(x,y){ return Math.hypot(x,y); }

// Push a circle out of an axis-aligned rect. Returns the axis of the
// shallowest overlap ("x"/"y") or null when there is no contact.
function resolveCircleRect(c, r, rad){
  const nx = clamp(c.x, r.x, r.x + r.w), ny = clamp(c.y, r.y, r.y + r.h);
  const dx = c.x - nx, dy = c.y - ny, d2 = dx*dx + dy*dy;
  if (d2 > rad*rad) return null;

  if (d2 > 1e-6){                      // touching an edge or corner
    const d = Math.sqrt(d2), push = rad - d;
    c.x += (dx/d) * push; c.y += (dy/d) * push;
    return Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  }
  // centre is inside the rect: eject along the shallowest face
  const l = c.x - r.x, rr = r.x + r.w - c.x, t = c.y - r.y, b = r.y + r.h - c.y;
  const m = Math.min(l, rr, t, b);
  if (m === l)  { c.x = r.x - rad;        return "x"; }
  if (m === rr) { c.x = r.x + r.w + rad;  return "x"; }
  if (m === t)  { c.y = r.y - rad;        return "y"; }
  c.y = r.y + r.h + rad;                  return "y";
}

/* ============================================================
   SIMULATION
   ============================================================ */
const EBB_FRAMES = 150;          // ~1.25s of position history at the fixed step

class Player {
  constructor(idx){ this.idx = idx; this.charId = DEFAULT_PICKS[idx]; this.reset(0,0); }

  reset(x,y){
    this.char = CHARS[this.charId];
    this.st = this.char.st;
    this.x=x; this.y=y; this.vx=0; this.vy=0;
    this.fx = x < W/2 ? 1 : -1; this.fy = 0;   // facing, unit vector
    this.alive = true;
    this.ammo = this.st.ammo; this.reloads = [];
    this.fireCd = 0; this.parryCd = 0; this.parryT = 0;
    this.dashCd = 0; this.dashT = 0;
    this.flash = 0; this.charge = 0; this.ghost = 0; this.burstT = 0;
    this.primed = false;                        // Meran's prism is loaded
    this.hist = [];
  }
  get facing(){ return Math.atan2(this.fy, this.fx); }
  get ready(){ return this.charge >= CHG_FULL; }
  addCharge(n){ this.charge = Math.min(CHG_FULL, this.charge + n); }
}

let MOTE_SEQ = 0;
class Mote {
  constructor(p, x, y, vx, vy){
    const st = p.st;
    this.id = ++MOTE_SEQ;
    this.owner = p.idx; this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.radius = st.moteRadius; this.maxBounces = st.moteBounces;
    this.life = st.moteLife; this.armTime = st.armTime; this.gain = st.bounceGain;
    this.age=0; this.bounces=0; this.armed=false; this.dead=false;
    this.split=false; this.given=0; this.miss=[]; this.rings=[];
    this.trail=[];
  }
}

class Game {
  constructor(picks){
    const list = (picks && picks.length ? picks : DEFAULT_PICKS.slice(0, SEAT_COUNT));
    this.round=0;
    this.motes=[];
    this.players = list.map((c,i) => { const p = new Player(i); p.charId = c; return p; });
    this.scores = list.map(() => 0);
    this.sparks=[];
    this.shake=0;
    this.loadRound(0);
  }

  setPicks(picks){
    picks.forEach((c,i) => { if (this.players[i]) this.players[i].charId = c; });
  }
  get picks(){ return this.players.map(p => p.charId); }
  get alive(){ return this.players.filter(p => p.alive); }

  loadRound(i){
    this.round = i;
    MOTE_SEQ = 0;          // ids restart each round: the CPU reads them, and its
                           // answer to a position must not depend on how many
                           // motes the page happened to spawn before this one

    this.arena = ARENAS[i % ARENAS.length];
    this.walls = this.arena.walls.map(w => ({...w}));
    this.temps = [];                 // walls conjured by specials
    this.rings = [];
    this.motes.length = 0;
    this.sparks.length = 0;
    this.time = 0;
    this.encroach = 0;
    this.closeTimer = 0;
    this.overTimer = 0;
    this.result = null;              // {winner:0|1|-1}
    const sp = this.spawnPoints(this.players.length);
    this.players.forEach((p,i) => {
      p.reset(sp[i][0], sp[i][1]);
      const a = Math.atan2(H/2 - sp[i][1], W/2 - sp[i][0]);   // everyone faces the middle
      p.fx = Math.cos(a); p.fy = Math.sin(a);
    });
  }

  /* Two keepers use the arena's own hand-placed spawns. More than two stand on
     a ring around the centre, evenly spaced, so the start is the same shape for
     everyone however many are playing. */
  spawnPoints(n){
    if (n === 2) return this.arena.spawns;
    const out = [];
    for (let i=0;i<n;i++){
      const a = -Math.PI/2 + i*2*Math.PI/n;
      let rx = 760, ry = 470, x = 0, y = 0, ok = false;
      for (let tries=0; tries<14 && !ok; tries++){
        x = W/2 + Math.cos(a)*rx; y = H/2 + Math.sin(a)*ry;
        ok = !this.blockedAt(x, y, 20);
        if (!ok){ rx -= 44; ry -= 28; }
      }
      out.push([clamp(x, 40, W-40), clamp(y, 40, H-40)]);
    }
    return out;
  }

  blockedAt(x, y, r){
    if (x < r || x > W-r || y < r || y > H-r) return true;
    for (const w of this.obstacles) if (resolveCircleRect({x,y}, w, r)) return true;
    return false;
  }

  // Every solid thing a mote or a keeper can meet, arena and conjured alike.
  get obstacles(){ return this.walls.concat(this.temps); }

  bounds(){
    const e = this.encroach;
    return {x:e, y:e, w:W-2*e, h:H-2*e};
  }

  step(dt, inputs){
    this.time += dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt*3.5);

    for (let i = this.temps.length - 1; i >= 0; i--){
      this.temps[i].ttl -= dt;
      if (this.temps[i].ttl <= 0) this.temps.splice(i,1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--){
      this.rings[i].t += dt;
      if (this.rings[i].t >= this.rings[i].life) this.rings.splice(i,1);
    }

    if (!this.result){
      // The dark closes in so a stalemate cannot simply be waited out.
      if (this.time > ROUND_TIME){
        this.closeTimer += dt;
        if (this.closeTimer >= CLOSE_STEP){
          this.closeTimer -= CLOSE_STEP;
          // No ceiling: the dark keeps stepping in until it catches whoever
          // is worst placed. A round cannot be waited out.
          this.encroach += CLOSE_AMOUNT;
        }
      }
      this.players.forEach((p,i) => this.stepPlayer(p, inputs[i] || blankInput(), dt));
      this.stepMotes(dt);
      this.checkDeaths();
    } else {
      this.overTimer += dt;
      this.stepMotes(dt * 0.25);   // slow motion on the kill
    }
    this.stepSparks(dt);
  }

  stepPlayer(p, inp, dt){
    if (!p.alive) return;
    const st = p.st;
    p.fireCd  = Math.max(0, p.fireCd  - dt);
    p.parryCd = Math.max(0, p.parryCd - dt);
    p.dashCd  = Math.max(0, p.dashCd  - dt);
    p.parryT  = Math.max(0, p.parryT  - dt);
    p.dashT   = Math.max(0, p.dashT   - dt);
    p.flash   = Math.max(0, p.flash   - dt);
    p.ghost   = Math.max(0, p.ghost   - dt);
    p.burstT  = Math.max(0, p.burstT  - dt);

    p.hist.push(p.x, p.y);
    if (p.hist.length > EBB_FRAMES*2) p.hist.splice(0, p.hist.length - EBB_FRAMES*2);

    for (let i = p.reloads.length - 1; i >= 0; i--){
      p.reloads[i] -= dt;
      if (p.reloads[i] <= 0){ p.reloads.splice(i,1); p.ammo = Math.min(st.ammo, p.ammo + 1); }
    }

    let ax = inp.ax, ay = inp.ay;
    const m = len(ax, ay);
    if (m > 0){
      ax /= m; ay /= m;
      p.fx = ax; p.fy = ay;                 // aim is welded to movement: no free-look
    }

    if (inp.special && p.ready){ p.charge = 0; p.burstT = 0.4; this.useSpecial(p); }

    if (inp.dash && p.dashCd <= 0){
      p.vx = p.fx * st.dashSpeed; p.vy = p.fy * st.dashSpeed;
      p.dashT = st.dashTime; p.dashCd = st.dashCd;
    }
    if (inp.parry && p.parryCd <= 0 && p.ghost <= 0){
      p.parryT = st.parryTime; p.parryCd = st.parryCd;
    }
    if (inp.fire && p.fireCd <= 0 && p.ammo > 0 && p.ghost <= 0){
      p.ammo--; p.fireCd = st.fireCd;
      const mo = this.spawnMote(p, 0);
      if (p.primed){ mo.split = true; p.primed = false; }
    }

    if (p.dashT <= 0){
      p.vx += ax * st.accel * dt; p.vy += ay * st.accel * dt;
      const damp = Math.exp(-st.friction * dt);
      p.vx *= damp; p.vy *= damp;
      const s = len(p.vx, p.vy);
      if (s > st.maxSpeed){ p.vx = p.vx/s*st.maxSpeed; p.vy = p.vy/s*st.maxSpeed; }
    }

    p.x += p.vx * dt; p.y += p.vy * dt;
    this.confinePlayer(p);
  }

  confinePlayer(p){
    const rad = p.st.radius, b = this.bounds();
    if (p.x < b.x + rad){ p.x = b.x + rad; p.vx = 0; }
    if (p.x > b.x + b.w - rad){ p.x = b.x + b.w - rad; p.vx = 0; }
    if (p.y < b.y + rad){ p.y = b.y + rad; p.vy = 0; }
    if (p.y > b.y + b.h - rad){ p.y = b.y + b.h - rad; p.vy = 0; }
    for (const w of this.obstacles){
      const axis = resolveCircleRect(p, w, rad);
      if (axis === "x") p.vx = 0; else if (axis === "y") p.vy = 0;
    }
  }

  spawnMote(p, angleOffset){
    const a = p.facing + angleOffset;
    const dx = Math.cos(a), dy = Math.sin(a);
    const off = p.st.radius + p.st.moteRadius + 2;
    const mo = new Mote(p, p.x + dx*off, p.y + dy*off, dx*p.st.moteSpeed, dy*p.st.moteSpeed);
    this.motes.push(mo);
    return mo;
  }

  /* ---------- the specials ---------- */
  useSpecial(p){
    const st = p.st;
    this.burst(p.x, p.y, p.char.color, 26, 220);
    switch (p.char.id){

      case "ines":                       // SECOND WICK — three at once, free of ammo
        this.spawnMote(p, -0.30); this.spawnMote(p, 0); this.spawnMote(p, 0.30);
        break;

      case "cato": {                     // EBB — step back into your own past
        if (p.hist.length >= 2){
          p.x = p.hist[0]; p.y = p.hist[1];
          p.vx = 0; p.vy = 0; p.hist.length = 0;
          this.confinePlayer(p);
          this.burst(p.x, p.y, p.char.color, 24, 200);
        }
        break;
      }

      case "meran":                      // PRISM — load the next shot
        p.primed = true;
        break;

      case "odall": {                    // BREAKWATER — raise a wall of slag
        const horiz = Math.abs(p.fx) >= Math.abs(p.fy);
        const w = horiz ? 16 : 96, h = horiz ? 96 : 16;
        this.temps.push({ x: clamp(p.x + p.fx*52 - w/2, 2, W-w-2),
                          y: clamp(p.y + p.fy*52 - h/2, 2, H-h-2),
                          w, h, ttl:5, owner:p.idx });
        break;
      }

      case "silt":                       // DUCK UNDER — let the light pass through
        p.ghost = 0.7;
        break;

      case "vane":                       // RECALL — every mote of yours turns around
        for (const mo of this.motes){
          if (mo.owner !== p.idx || mo.dead) continue;
          mo.vx = -mo.vx; mo.vy = -mo.vy;
          mo.armed = true; mo.trail.length = 0;
          this.burst(mo.x, mo.y, p.char.color, 8);
        }
        break;

      case "keel":                       // RINGING — throw everything outward
        this.rings.push({ id:++MOTE_SEQ, x:p.x, y:p.y, t:0, life:0.42, owner:p.idx });
        this.shake = Math.max(this.shake, 0.5);
        break;

      case "auger": {                    // SINKHOLE — a hole that drinks light
        const s = 74;
        this.temps.push({ x: clamp(p.x + p.fx*62 - s/2, 2, W-s-2),
                          y: clamp(p.y + p.fy*62 - s/2, 2, H-s-2),
                          w:s, h:s, ttl:6, void:true, owner:p.idx });
        break;
      }
    }
  }

  stepMotes(dt){
    const STEPS = 4, h = dt / STEPS;
    for (const mo of this.motes){
      if (mo.dead) continue;
      mo.age += dt;
      if (!mo.armed && mo.age >= mo.armTime) mo.armed = true;
      if (mo.age >= mo.life) { this.fizzle(mo); continue; }

      mo.trail.push(mo.x, mo.y);
      if (mo.trail.length > 16) mo.trail.splice(0, mo.trail.length - 16);

      for (let s=0; s<STEPS && !mo.dead; s++){
        mo.x += mo.vx * h; mo.y += mo.vy * h;

        const b = this.bounds(), r = mo.radius;
        if (mo.x < b.x + r){ mo.x = b.x + r; mo.vx = -mo.vx; this.onBounce(mo); }
        else if (mo.x > b.x + b.w - r){ mo.x = b.x + b.w - r; mo.vx = -mo.vx; this.onBounce(mo); }
        if (mo.y < b.y + r){ mo.y = b.y + r; mo.vy = -mo.vy; this.onBounce(mo); }
        else if (mo.y > b.y + b.h - r){ mo.y = b.y + b.h - r; mo.vy = -mo.vy; this.onBounce(mo); }

        for (const w of this.obstacles){
          const axis = resolveCircleRect(mo, w, r);
          if (!axis) continue;
          if (w.void){ this.burst(mo.x, mo.y, "#5a6b80", 10); this.kill(mo); break; }
          if (axis === "x") mo.vx = -mo.vx; else mo.vy = -mo.vy;
          this.onBounce(mo);
        }
      }
      if (mo.dead) continue;

      // Keel's ring throws motes outward as it passes over them.
      for (const ring of this.rings){
        if (mo.rings.includes(ring.id)) continue;
        const rad = 210 * (ring.t / ring.life);
        const dx = mo.x - ring.x, dy = mo.y - ring.y, d = len(dx,dy) || 1;
        if (d > rad) continue;
        mo.rings.push(ring.id);
        const sp = Math.max(len(mo.vx, mo.vy), 620);
        mo.vx = dx/d * sp; mo.vy = dy/d * sp;
        mo.owner = ring.owner; mo.armed = true; mo.trail.length = 0;
        this.burst(mo.x, mo.y, CHARS[this.players[ring.owner].charId].color, 10);
      }

      // Parry: a live guard in front of a keeper catches the mote and
      // sends it back along whatever direction that keeper is facing.
      // If both keepers could catch the same mote on the same frame the
      // nearer mirror takes it; a dead heat goes to neither, so seat order
      // never decides a duel.
      let claim = null, tie = false;
      for (const p of this.players){
        if (!p.alive || p.parryT <= 0) continue;
        const dx = mo.x - p.x, dy = mo.y - p.y, d = len(dx,dy);
        if (d > p.st.parryReach + mo.radius) continue;
        let a = Math.atan2(dy,dx) - p.facing;
        a = Math.atan2(Math.sin(a), Math.cos(a));
        if (Math.abs(a) > p.st.parryArc/2) continue;
        if (!claim || d < claim.d - 1e-9){ claim = {p, d}; tie = false; }
        else if (Math.abs(d - claim.d) <= 1e-9) tie = true;
      }
      if (claim && !tie){
        const p = claim.p;
        mo.owner = p.idx; mo.armed = true; mo.bounces = 0;
        mo.miss = [];
        mo.vx = p.fx * p.st.returnSpeed; mo.vy = p.fy * p.st.returnSpeed;
        mo.x = p.x + p.fx * (p.st.radius + mo.radius + 3);
        mo.y = p.y + p.fy * (p.st.radius + mo.radius + 3);
        mo.trail.length = 0;
        p.flash = 0.22; p.parryT = 0; p.addCharge(CHG_PARRY);
        this.shake = Math.max(this.shake, 0.35);
        this.burst(mo.x, mo.y, p.char.color, 16);
      }
    }
    this.motes = this.motes.filter(m => !m.dead);
  }

  onBounce(mo){
    mo.armed = true;                 // after one wall, it belongs to nobody
    mo.bounces++;
    mo.trail.length = 0;
    if (mo.gain !== 1){ mo.vx *= mo.gain; mo.vy *= mo.gain; }
    this.burst(mo.x, mo.y, "#cfe6ff", 4);

    if (mo.given < 3){ mo.given++; this.players[mo.owner].addCharge(CHG_BOUNCE); }

    if (mo.split && mo.bounces === 1){          // Meran's prism opens here
      mo.split = false;
      const sp = len(mo.vx, mo.vy), a = Math.atan2(mo.vy, mo.vx);
      for (const off of [-0.38, 0.38]){
        const clone = new Mote(this.players[mo.owner], mo.x, mo.y,
                               Math.cos(a+off)*sp, Math.sin(a+off)*sp);
        clone.armed = true; clone.bounces = 1;
        this.motes.push(clone);
      }
      this.burst(mo.x, mo.y, this.players[mo.owner].char.color, 14);
    }
    if (mo.bounces > mo.maxBounces) this.fizzle(mo);
  }

  fizzle(mo){
    this.burst(mo.x, mo.y, "#8fa3bb", 6);
    this.kill(mo);
  }

  kill(mo){
    if (mo.dead) return;
    mo.dead = true;
    this.players[mo.owner].reloads.push(this.players[mo.owner].st.reload);
  }

  checkDeaths(){
    if (this.result) return;
    const dead = this.players.map(() => false);

    for (const p of this.players){
      if (!p.alive) continue;
      const b = this.bounds();
      if (p.x < b.x || p.x > b.x+b.w || p.y < b.y || p.y > b.y+b.h) dead[p.idx] = true;

      for (const mo of this.motes){
        if (mo.dead) continue;
        const d = len(mo.x-p.x, mo.y-p.y);
        if (!mo.armed && mo.owner === p.idx) continue;  // your own shot is inert until it arms
        if (d <= p.st.radius + mo.radius){
          if (p.ghost > 0) continue;                    // Silt is letting it through
          dead[p.idx] = true; mo.dead = true;
        } else if (mo.armed && !mo.miss[p.idx] && d <= p.st.radius + mo.radius + 18){
          mo.miss[p.idx] = true; p.addCharge(CHG_MISS); // read it, earn it
        }
      }
    }
    if (!dead.some(Boolean)) return;

    dead.forEach((d,i) => {
      if (!d) return;
      const p = this.players[i];
      p.alive = false; p.placed = this.alive.length + 1;    // finishing position
      this.burst(p.x, p.y, p.char.color, 46, 260);
    });
    this.shake = 1;

    const left = this.alive;
    if (left.length > 1) return;                 // battle royale carries on
    const winner = left.length === 1 ? left[0].idx : -1;
    this.result = { winner };
    if (winner >= 0) this.scores[winner]++;
  }

  /* cosmetic only — never touched by anything the outcome depends on */
  burst(x,y,color,n,spd=150){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = spd*(0.25+Math.random()*0.9);
      this.sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.35+Math.random()*0.4,t:0,color});
    }
  }
  stepSparks(dt){
    for (let i=this.sparks.length-1;i>=0;i--){
      const s = this.sparks[i];
      s.t += dt;
      if (s.t >= s.life){ this.sparks.splice(i,1); continue; }
      s.x += s.vx*dt; s.y += s.vy*dt;
      s.vx *= 0.94; s.vy *= 0.94;
    }
  }

  /* ---------- network snapshot (host -> guest) ---------- */
  snapshot(){
    return {
      r:this.round, t:this.time, e:this.encroach, sc:this.scores, pk:this.picks, n:this.players.length,
      res:this.result ? this.result.winner : null,
      p:this.players.map(p => [
        Math.round(p.x*10)/10, Math.round(p.y*10)/10,
        Math.round(p.fx*100)/100, Math.round(p.fy*100)/100,
        p.alive?1:0, p.ammo,
        Math.round(p.parryT*100)/100, Math.round(p.dashCd*100)/100,
        Math.round(p.parryCd*100)/100, Math.round(p.flash*100)/100,
        Math.round(p.charge), Math.round(p.ghost*100)/100,
        p.primed?1:0, Math.round(p.burstT*100)/100 ]),
      m:this.motes.map(m => [
        Math.round(m.x*10)/10, Math.round(m.y*10)/10,
        Math.round(m.vx), Math.round(m.vy), m.owner, m.armed?1:0, m.radius ]),
      w:this.temps.map(t => [t.x, t.y, t.w, t.h, t.void?1:0, Math.round(t.ttl*10)/10]),
      g:this.rings.map(r => [r.x, r.y, Math.round(r.t*100)/100, r.life]),
      sh:Math.round(this.shake*100)/100,
    };
  }

  applySnapshot(s){
    if (s.n !== this.players.length){            // a keeper joined or left the match
      SEAT_COUNT = s.n;
      this.players = s.pk.map((c,i) => { const p = new Player(i); p.charId = c; return p; });
      this.scores = s.sc.slice();
      this.loadRound(s.r);
    }
    if (s.pk && s.pk.some((c,i) => c !== this.players[i].charId)){
      this.setPicks(s.pk);
      this.players.forEach(p => { p.char = CHARS[p.charId]; p.st = p.char.st; });
    }
    if (s.r !== this.round) this.loadRound(s.r);
    this.time = s.t; this.encroach = s.e; this.scores = s.sc;
    this.shake = s.sh;
    this.result = s.res === null ? null : { winner:s.res };

    s.p.forEach((a,i) => {
      const p = this.players[i];
      p.x=a[0]; p.y=a[1]; p.fx=a[2]; p.fy=a[3]; p.alive=!!a[4];
      p.ammo=a[5]; p.parryT=a[6]; p.dashCd=a[7]; p.parryCd=a[8]; p.flash=a[9];
      p.charge=a[10]; p.ghost=a[11]; p.primed=!!a[12]; p.burstT=a[13];
    });
    this.temps = s.w.map(t => ({x:t[0], y:t[1], w:t[2], h:t[3], void:!!t[4], ttl:t[5]}));
    this.rings = s.g.map(r => ({x:r[0], y:r[1], t:r[2], life:r[3]}));

    // Rebuild motes, keeping trails for ones that persisted.
    const old = this.motes;
    this.motes = s.m.map((a,i) => {
      const mo = new Mote(this.players[a[4]], a[0], a[1], a[2], a[3]);
      mo.armed = !!a[5]; mo.radius = a[6];
      if (old[i]) mo.trail = old[i].trail;
      mo.trail.push(mo.x, mo.y);
      if (mo.trail.length > 16) mo.trail.splice(0, mo.trail.length - 16);
      return mo;
    });
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function drawRect(r, fill, top){
  ctx.fillStyle = fill;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  if (top){ ctx.fillStyle = top; ctx.fillRect(r.x, r.y, r.w, 2); }
}

function wrapText(text, x, y, maxW, lineH, maxLines){
  const words = text.split(" ");
  let line = "", lines = 0;
  for (const word of words){
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width > maxW && line){
      const lastAllowed = lines === maxLines-1;
      ctx.fillText(lastAllowed ? line + "…" : line, x, y + lines*lineH);
      if (++lines >= maxLines) return lines;
      line = word;
    } else line = test;
  }
  if (line){ ctx.fillText(line, x, y + lines*lineH); lines++; }
  return lines;
}

// Auger's dowsing line: where the shot actually goes, two walls ahead.
function predictPath(g, p, maxBounces){
  const pts = [];
  let x = p.x + p.fx*(p.st.radius+2), y = p.y + p.fy*(p.st.radius+2);
  let dx = p.fx, dy = p.fy, bounces = 0, travelled = 0;
  const STEP = 5, r = p.st.moteRadius;
  pts.push(x, y);
  while (bounces <= maxBounces && travelled < 1100){
    x += dx*STEP; y += dy*STEP; travelled += STEP;
    const b = g.bounds();
    let hit = null;
    if (x < b.x + r || x > b.x + b.w - r) hit = "x";
    else if (y < b.y + r || y > b.y + b.h - r) hit = "y";
    if (!hit){
      for (const w of g.obstacles){
        const probe = {x, y};
        const axis = resolveCircleRect(probe, w, r);
        if (axis){ if (w.void) { pts.push(x,y); return pts; } x = probe.x; y = probe.y; hit = axis; break; }
      }
    } else {
      x = clamp(x, b.x + r, b.x + b.w - r);
      y = clamp(y, b.y + r, b.y + b.h - r);
    }
    if (hit){
      pts.push(x, y);
      if (++bounces > maxBounces) break;
      if (hit === "x") dx = -dx; else dy = -dy;
    }
  }
  pts.push(x, y);
  return pts;
}

function render(g, ui){
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.clearRect(0,0,VW,VH);

  const sky = ctx.createRadialGradient(VW/2, VH/2, 30, VW/2, VH/2, VW*0.8);
  sky.addColorStop(0, "#101c2b"); sky.addColorStop(1, "#05080e");
  ctx.fillStyle = sky; ctx.fillRect(0,0,VW,VH);

  const z = CAM.zoom, k = viewScale*z;
  ctx.setTransform(k, 0, 0, k, viewScale*(VW/2 - CAM.x*z), viewScale*(VH/2 - CAM.y*z));
  ctx.save();

  const grd = ctx.createRadialGradient(W/2, H/2, 40, W/2, H/2, W*0.75);
  grd.addColorStop(0, "#132132"); grd.addColorStop(1, "#070b12");
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

  if (g.shake > 0){
    const s = g.shake * 7;
    ctx.translate((Math.random()*2-1)*s, (Math.random()*2-1)*s);
  }

  // tide grid
  ctx.strokeStyle = "rgba(130,180,225,.075)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x=0;x<=W;x+=48){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); }
  for (let y=0;y<=H;y+=48){ ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); }
  ctx.stroke();

  // arena walls
  for (const w of g.walls){
    if (w.void){
      drawRect(w, "#03050a");
      ctx.strokeStyle = "rgba(120,145,180,.7)"; ctx.setLineDash([5,5]);
      ctx.strokeRect(w.x+.5, w.y+.5, w.w-1, w.h-1); ctx.setLineDash([]);
    } else {
      drawRect(w, "#26374b", "rgba(190,225,255,.75)");
      ctx.strokeStyle = "rgba(150,190,230,.22)"; ctx.lineWidth = 1;
      ctx.strokeRect(w.x+.5, w.y+.5, w.w-1, w.h-1);
    }
  }

  // conjured walls: they fade as their time runs out
  for (const t of g.temps){
    const col = g.players[t.owner] ? g.players[t.owner].char.color : "#9fb6cc";
    const a = clamp(t.ttl/1.2, 0.25, 1);
    ctx.globalAlpha = a;
    if (t.void){
      drawRect(t, "#02040a");
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([6,6]);
      ctx.strokeRect(t.x+1, t.y+1, t.w-2, t.h-2); ctx.setLineDash([]);
      ctx.globalAlpha = a*0.5;
      ctx.beginPath(); ctx.arc(t.x+t.w/2, t.y+t.h/2, t.w*0.22, 0, 7);
      ctx.strokeStyle = col; ctx.stroke();
    } else {
      drawRect(t, "#3a4a5e", col);
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.strokeRect(t.x+1, t.y+1, t.w-2, t.h-2);
    }
    ctx.globalAlpha = 1;
  }

  // Keel's ring
  for (const ring of g.rings){
    const k = ring.t / ring.life;
    ctx.globalAlpha = (1-k) * 0.85;
    ctx.strokeStyle = "#e8f4ff"; ctx.lineWidth = 3 + 4*(1-k);
    ctx.beginPath(); ctx.arc(ring.x, ring.y, 210*k, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // the closing dark, and the nothing beyond the coast
  {
    const b = g.bounds(), M = 4000;
    ctx.fillStyle = "rgba(2,3,6,.95)";
    ctx.fillRect(-M, -M, W+2*M, b.y+M);
    ctx.fillRect(-M, b.y+b.h, W+2*M, M+H);
    ctx.fillRect(-M, b.y, b.x+M, b.h);
    ctx.fillRect(b.x+b.w, b.y, M+W, b.h);
    ctx.strokeStyle = g.encroach > 0 ? "rgba(140,170,210,.55)" : "rgba(150,190,230,.2)";
    ctx.lineWidth = 2/Math.max(CAM.zoom, .4);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
  }

  // Auger's dowsing line
  for (const p of g.players){
    if (!p.alive || p.char.id !== "auger") continue;
    const pts = predictPath(g, p, 2);
    ctx.globalAlpha = .32; ctx.strokeStyle = p.char.color;
    ctx.lineWidth = 1.5; ctx.setLineDash([7,9]);
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i], pts[i+1]);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // sparks
  for (const s of g.sparks){
    ctx.globalAlpha = 1 - s.t/s.life; ctx.fillStyle = s.color;
    ctx.fillRect(s.x-1.5, s.y-1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // motes
  ctx.lineCap = "round";
  for (const m of g.motes){
    const owner = g.players[m.owner].char.color;
    if (m.trail.length >= 4){
      ctx.strokeStyle = owner; ctx.globalAlpha = .28; ctx.lineWidth = m.radius*0.7;
      ctx.beginPath(); ctx.moveTo(m.trail[0], m.trail[1]);
      for (let i=2;i<m.trail.length;i+=2) ctx.lineTo(m.trail[i], m.trail[i+1]);
      ctx.lineTo(m.x, m.y); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = m.armed ? 22 : 12;
    ctx.shadowColor = owner;
    ctx.fillStyle = m.armed ? "#ffffff" : owner;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.armed ? m.radius : m.radius-1, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    if (!m.armed){
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.radius+3, 0, 7); ctx.stroke();
    }
  }

  // keepers
  for (const p of g.players){
    if (!p.alive) continue;
    const col = p.char.color, rad = p.st.radius;

    if (p.parryT > 0 || p.flash > 0){
      const a = p.parryT > 0 ? 1 : p.flash/0.22;
      ctx.globalAlpha = 0.25 + 0.6*a;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.st.parryReach, p.facing - p.st.parryArc/2, p.facing + p.st.parryArc/2);
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    if (p.burstT > 0){                      // the moment a special goes off
      const k = p.burstT/0.4;
      ctx.globalAlpha = k*0.8; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad + 34*(1-k), 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.globalAlpha = p.ghost > 0 ? 0.32 : 1;    // Silt, mid-duck
    ctx.shadowBlur = 26; ctx.shadowColor = col;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#05080d";
    ctx.beginPath(); ctx.arc(p.x, p.y, rad-5, 0, 7); ctx.fill();

    // the mirror: which way the shot and the guard will go
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x + p.fx*(rad-1), p.y + p.fy*(rad-1));
    ctx.lineTo(p.x + p.fx*(rad+9), p.y + p.fy*(rad+9));
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (p.primed){                          // Meran's prism is loaded
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad+5, 0, 7); ctx.stroke();
    }
    if (p.ready){                           // special is charged
      ctx.globalAlpha = 0.55 + 0.45*Math.sin(g.time*7);
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad+9, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (p.dashCd > p.st.dashCd - p.st.dashTime - 0.1){
      ctx.globalAlpha = .35; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad+6, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }

  ctx.restore();
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  drawHUD(g, ui);
}

function bar(x,y,w,h,frac,color){
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = color; ctx.fillRect(x,y,w*clamp(frac,0,1),h);
}

function drawHUD(g, ui){
  ctx.font = "600 12px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.textBaseline = "top";
  if (g.players.length > 2) drawRoyaleRoster(g); else drawDuelHUD(g);
  drawCentreHUD(g, ui);
}

const MONO = "ui-monospace,SFMono-Regular,Menlo,monospace";

function drawRoyaleRoster(g){
  const mine = netMode === "guest" ? MY_SEAT : 0;
  const standing = g.alive.length;
  g.players.forEach((p,i) => {
    const y = 14 + i*30, x = 18, col = p.char.color;
    ctx.globalAlpha = p.alive ? 1 : 0.3;

    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x+5, y+7, 5, 0, 7); ctx.fill();
    if (!p.alive){
      ctx.strokeStyle = "#8fa3bb"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y+7); ctx.lineTo(x+128, y+7); ctx.stroke();
    }

    ctx.textAlign = "left";
    ctx.font = "600 11px " + MONO;
    ctx.fillStyle = p.alive ? "#e8eef7" : "#7b8899";
    const tag = i === mine && !CPU.seats[i] ? " ◂you" : (CPU.seats[i] ? " ·cpu" : "");
    ctx.fillText(p.char.name + tag, x+16, y+1);

    for (let k=0;k<WINS_BR;k++){                       // rounds won
      const px = x+104+k*11;
      ctx.beginPath(); ctx.arc(px, y+6, 3.5, 0, 7);
      if (k < g.scores[i]){ ctx.fillStyle = col; ctx.fill(); }
      else { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1; ctx.stroke(); }
    }
    if (p.alive){
      for (let a=0;a<p.st.ammo;a++){                   // motes in hand
        const px = x+17+a*8;
        ctx.beginPath(); ctx.arc(px, y+18, 2.4, 0, 7);
        if (a < p.ammo){ ctx.fillStyle = "#e9f2ff"; ctx.fill(); }
        else { ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.stroke(); }
      }
      bar(x+58, y+16, 62, 4, p.charge/CHG_FULL, p.ready ? "#ffffff" : "rgba(255,255,255,.4)");
    }
    ctx.globalAlpha = 1;
  });
  ctx.textAlign = "left";
  ctx.font = "600 10px " + MONO;
  ctx.fillStyle = "rgba(200,215,235,.5)";
  ctx.fillText(standing + " STILL BURNING", 18, 14 + g.players.length*30 + 4);
}

function drawDuelHUD(g){
  for (let i=0;i<2;i++){
    const p = g.players[i], col = p.char.color;
    const right = i === 1, x = right ? VW-24 : 24;
    ctx.textAlign = right ? "right" : "left";

    ctx.fillStyle = col;
    ctx.fillText(p.char.name, x, 14);
    ctx.fillStyle = CPU.seats[i] ? "rgba(255,255,255,.5)" : "rgba(200,215,235,.38)";
    ctx.font = "500 10px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillText(CPU.seats[i] ? "CPU · " + CPU_LEVELS[CPU.level].id : p.char.title.toUpperCase(), x, 29);
    ctx.font = "600 12px ui-monospace,SFMono-Regular,Menlo,monospace";

    for (let s=0;s<WINS_NEEDED;s++){          // rounds won
      const px = right ? x - 8 - s*16 : x + 4 + s*16;
      ctx.beginPath(); ctx.arc(px, 50, 5, 0, 7);
      if (s < g.scores[i]){ ctx.fillStyle = col; ctx.fill(); }
      else { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1; ctx.stroke(); }
    }
    for (let a=0;a<p.st.ammo;a++){            // motes in hand
      const px = right ? x - 6 - a*12 : x + 6 + a*12;
      ctx.beginPath(); ctx.arc(px, 68, 3.2, 0, 7);
      if (a < p.ammo){ ctx.fillStyle = "#e9f2ff"; ctx.fill(); }
      else { ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.stroke(); }
    }
    const bx = right ? x - 92 : x;
    bar(bx, 80, 92, 3, 1 - p.parryCd/p.st.parryCd, "rgba(255,255,255,.65)");
    bar(bx, 87, 92, 3, 1 - p.dashCd/p.st.dashCd,  col);
    bar(bx, 96, 92, 5, p.charge/CHG_FULL, p.ready ? "#ffffff" : "rgba(255,255,255,.45)");

    ctx.font = "600 9px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillStyle = p.ready ? "#ffffff" : "rgba(200,215,235,.35)";
    ctx.fillText(p.ready ? p.char.special + " READY" : p.char.special, right ? x : x, 106);
    ctx.font = "600 12px ui-monospace,SFMono-Regular,Menlo,monospace";
  }
}

function drawCentreHUD(g, ui){
  ctx.font = "600 12px " + MONO;
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(210,225,245,.55)";
  ctx.fillText(g.arena.name.toUpperCase(), VW/2, 16);

  const left = ROUND_TIME - g.time;
  if (left > 0){
    ctx.fillStyle = left < 10 ? "#ffb347" : "rgba(210,225,245,.4)";
    ctx.fillText("THE DARK IN " + Math.ceil(left), VW/2, 34);
  } else {
    ctx.fillStyle = "#ff7a6b";
    ctx.fillText("THE DARK IS CLOSING", VW/2, 34);
  }

  if (ui.netLabel){
    ctx.fillStyle = "rgba(160,180,205,.5)";
    ctx.fillText(ui.netLabel, VW/2, VH-24);
  }
}

/* ============================================================
   CHARACTER SELECT  (drawn on the canvas so host and guest
   can share one screen over the wire)
   ============================================================ */
const SEL_COLS = 4, CARD_W = 204, CARD_H = 152, CARD_GAP = 16;
const SEL_X = (VW - (SEL_COLS*CARD_W + (SEL_COLS-1)*CARD_GAP)) / 2;
const SEL_Y = 132;

function cardRect(i){
  const c = i % SEL_COLS, r = Math.floor(i / SEL_COLS);
  return { x: SEL_X + c*(CARD_W+CARD_GAP), y: SEL_Y + r*(CARD_H+CARD_GAP), w:CARD_W, h:CARD_H };
}

function renderSelect(sel, ui){
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.clearRect(0,0,VW,VH);
  const grd = ctx.createRadialGradient(VW/2, VH/2, 40, VW/2, VH/2, VW*0.8);
  grd.addColorStop(0, "#101c2b"); grd.addColorStop(1, "#05080e");
  ctx.fillStyle = grd; ctx.fillRect(0,0,VW,VH);

  ctx.textBaseline = "top"; ctx.textAlign = "center";
  ctx.font = "600 11px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.fillStyle = "rgba(200,215,235,.45)";
  ctx.fillText("T H E   K E E P E R S   O F   T H E   C O A S T", VW/2, 44);
  ctx.font = "500 13px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.fillStyle = "rgba(200,215,235,.75)";
  ctx.fillText("Take a mirror.  Fire locks it in, guard takes it back.", VW/2, 72);

  for (let i=0;i<CHARS.length;i++){
    const c = CHARS[i], r = cardRect(i);
    const chosenBy = [];
    for (let s=0;s<SEAT_COUNT;s++) if (sel.cursor[s] === i) chosenBy.push(s);
    const lockedBy = chosenBy.filter(s => sel.locked[s]);

    const hovered = i === SEL_HOVER;
    ctx.fillStyle = lockedBy.length ? "rgba(24,38,54,.95)"
                  : hovered ? "rgba(23,41,60,.95)" : "rgba(16,26,38,.9)";
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = hovered ? "rgba(160,200,240,.5)" : "rgba(120,155,195,.22)";
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x+.5, r.y+.5, r.w-1, r.h-1);

    // the keeper's own light
    ctx.shadowBlur = 18; ctx.shadowColor = c.color;
    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.arc(r.x+28, r.y+30, 11, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(16,26,38,1)";
    ctx.beginPath(); ctx.arc(r.x+28, r.y+30, 6, 0, 7); ctx.fill();

    ctx.textAlign = "left";
    ctx.font = "600 15px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillStyle = c.color;
    ctx.fillText(c.name, r.x+50, r.y+18);
    ctx.font = "500 10px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillStyle = "rgba(200,215,235,.5)";
    ctx.fillText(c.title.toUpperCase(), r.x+50, r.y+36);

    ctx.font = "500 10.5px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillStyle = "rgba(205,220,238,.78)";
    wrapText(c.passive, r.x+14, r.y+58, r.w-28, 13, 3);

    ctx.fillStyle = c.color;
    ctx.font = "600 10px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillText("◆ " + c.special, r.x+14, r.y+104);
    ctx.fillStyle = "rgba(200,215,235,.58)";
    ctx.font = "500 10px ui-monospace,SFMono-Regular,Menlo,monospace";
    wrapText(c.specialText, r.x+14, r.y+120, r.w-28, 12, 2);

    // seat cursors sit just outside the card, one inset per seat
    chosenBy.forEach((s, k) => {
      const p = g_picksColor(s), inset = k * 4;
      ctx.strokeStyle = p; ctx.lineWidth = 2;
      ctx.globalAlpha = sel.locked[s] ? 1 : 0.55 + 0.45*Math.sin(Date.now()/160);
      ctx.strokeRect(r.x-3+inset, r.y-3+inset, r.w+6-2*inset, r.h+6-2*inset);
      ctx.globalAlpha = 1;
      ctx.fillStyle = p;
      ctx.font = "600 9px ui-monospace,SFMono-Regular,Menlo,monospace";
      ctx.textAlign = "left";
      const tag = "P" + (s+1) + (sel.locked[s] ? " LOCKED" : "");
      ctx.fillText(tag, r.x + k*52, r.y + r.h + 8);
    });
  }

  ctx.textAlign = "center";
  ctx.font = "500 11px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.fillStyle = "rgba(200,215,235,.45)";
  ctx.fillText((ui.selHint || "") + "   ·   click a keeper, click again to lock", VW/2, VH-42);
  ctx.fillStyle = "rgba(200,215,235,.3)";
  ctx.fillText("ESC  —  back to the menu", VW/2, VH-24);
}

// Seat colours on the select screen: the seat's own pick.
let SELECT_STATE = { cursor:[0,1], locked:[false,false], lastAx:[0,0], lastAy:[0,0] };
function g_picksColor(seat){ return CHARS[SELECT_STATE.cursor[seat]].color; }

let SEL_HOVER = -1;
function canvasPoint(e){
  const r = cvs.getBoundingClientRect();
  return { x:(e.clientX - r.left)/r.width*VW, y:(e.clientY - r.top)/r.height*VH };
}
function cardAt(pt){
  for (let i=0;i<CHARS.length;i++){
    const r = cardRect(i);
    if (pt.x>=r.x && pt.x<=r.x+r.w && pt.y>=r.y && pt.y<=r.y+r.h) return i;
  }
  return -1;
}
cvs.addEventListener("mousemove", e => {
  SEL_HOVER = state === ST.SELECT ? cardAt(canvasPoint(e)) : -1;
});
cvs.addEventListener("mouseleave", () => { SEL_HOVER = -1; });
cvs.addEventListener("click", e => {
  if (state !== ST.SELECT) return;
  const i = cardAt(canvasPoint(e));
  if (i < 0) return;
  const seat = netMode === "guest" ? MY_SEAT : 0;
  const locked = SELECT_STATE.locked[seat];
  const next = { i, lock: !locked && SELECT_STATE.cursor[seat] === i };
  if (netMode === "guest"){ send({ pick:{ i:next.i, lock:next.lock, unlock:locked } }); return; }
  applyPick(seat, next.i, next.lock, locked);
});
function applyPick(seat, i, lock, unlock){
  if (unlock){ SELECT_STATE.locked[seat] = false; return; }
  SELECT_STATE.cursor[seat] = i;
  if (lock) SELECT_STATE.locked[seat] = true;
  if (SELECT_STATE.locked.slice(0, SEAT_COUNT).every(Boolean)) beginMatch();
}

/* ============================================================
   OVERLAY CARDS
   ============================================================ */
let MENU_ITEMS = null, MENU_INDEX = 0, UI_CONFIRM = false;

function show(html){
  overlay.innerHTML = `<div class="card">${html}</div>`;
  overlay.classList.add("on");
  MENU_ITEMS = null;
}

function choiceList(items){
  return `<div class="rows">` + items.map((it,i) =>
    `<button class="row" data-i="${i}"><span class="n">${i+1}</span>
       <span class="t">${it.label}</span><span class="h">${it.hint||""}</span></button>`).join("") + `</div>`;
}

function bindChoices(items){
  MENU_ITEMS = items; MENU_INDEX = 0;
  overlay.querySelectorAll(".row").forEach(el => {
    const i = +el.dataset.i;
    el.onclick = () => { MENU_INDEX = i; items[i].fn(); };
    el.onmouseenter = () => { MENU_INDEX = i; paintChoices(); };
  });
  paintChoices();
}
function menuNav(){
  if (!MENU_ITEMS) return;
  const n = MENU_ITEMS.length;
  if (edge.has("ArrowDown") || edge.has("KeyS")){ MENU_INDEX = (MENU_INDEX+1)%n; paintChoices(); }
  if (edge.has("ArrowUp")   || edge.has("KeyW")){ MENU_INDEX = (MENU_INDEX-1+n)%n; paintChoices(); }
  for (let i=0;i<n;i++)
    if (edge.has("Digit"+(i+1)) || edge.has("Numpad"+(i+1))){ MENU_INDEX = i; MENU_ITEMS[i].fn(); return; }
  if (edge.has("Enter") || edge.has("Space")) MENU_ITEMS[MENU_INDEX].fn();
}

function paintChoices(){
  overlay.querySelectorAll(".row").forEach((el,i) => el.classList.toggle("on", i === MENU_INDEX));
}
/* Anything that says "press fire to continue" is also a button. */
function bindGo(){
  const b = overlay.querySelector(".go");
  if (b) b.onclick = () => { UI_CONFIRM = true; };
}

/* ============================================================
   NETWORK

   Two ways in, both peer-to-peer once connected:

   · JOIN CODE (the easy one) — the host is given a four-letter
     code and a link. A public broker introduces the two
     browsers to each other; after that the game data never
     touches it.
   · PASTE CODES (the fallback) — the two browsers introduce
     themselves by copy-paste, needing no broker at all. Slower
     to set up, but it works when the broker is blocked.

   Either way the host owns the simulation and the guest sends
   input and draws what it is told.
   ============================================================ */
let netMode = "local";                 // "local" | "host" | "guest"
let netNote = "";
let pc = null, ch = null;              // paste-code path
let peer = null, conn = null;          // join-code path (guest side)
let conns = [];                        // join-code path (host side), one per guest
let localSeq  = { f:0, p:0, d:0, s:0, c:0 };
const remoteSeqs = {};                 // per seat
const remotePkts = {};                 // per seat
let lastUiKey = "";

/* Public STUN, plus a public TURN relay for the networks that refuse to
   talk directly (strict company and mobile-carrier NATs). If the relay is
   unreachable the connection simply falls back to a direct route. */
const ICE = { iceServers:[
  { urls:["stun:stun.l.google.com:19302","stun:global.stun.twilio.com:3478"] },
  { urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443"],
    username:"openrelayproject", credential:"openrelayproject" },
]};

/* A self-hosted PeerServer can be pointed at with ?broker=host:port */
function brokerOptions(){
  const q = new URLSearchParams(location.search).get("broker");
  const base = { config:ICE, debug:0 };
  if (!q) return base;
  const [host, port] = q.split(":");
  return Object.assign(base, { host, port: Number(port) || 9000, path:"/",
                               secure: location.protocol === "https:" });
}

const PEERJS_SRCS = [
  "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js",
];
let peerLib = null;
function loadPeerJS(){
  if (window.Peer) return Promise.resolve(true);
  if (peerLib) return peerLib;
  peerLib = new Promise(resolve => {
    let i = 0;
    const attempt = () => {
      if (window.Peer) return resolve(true);
      if (i >= PEERJS_SRCS.length) return resolve(false);
      const tag = document.createElement("script");
      tag.src = PEERJS_SRCS[i++]; tag.async = true;
      tag.onload  = () => resolve(!!window.Peer);
      tag.onerror = attempt;
      document.head.appendChild(tag);
    };
    attempt();
    setTimeout(() => resolve(!!window.Peer), 9000);
  });
  return peerLib;
}

/* ---------- one transport interface, whichever path got us here ---------- */
const LINK = { open:false, send(){}, close(){} };

function linkUp(sendFn, closeFn){
  LINK.open = true; LINK.send = sendFn; LINK.close = closeFn;
  netNote = "";
  if (netMode === "host"){ SEAT_COUNT = 2; startSelect(); }
  else show(`<div class="kicker">Connected</div><h2>Waiting for the host</h2>
             <p>Choosing keepers begins in a moment.</p>`);
}
function linkData(msg, seat){
  if (!msg) return;
  if (netMode === "host"){
    if (msg.i) remotePkts[seat || 1] = msg.i;
    else if (msg.pick && state === ST.SELECT)
      applyPick(seat || 1, msg.pick.i, msg.pick.lock, msg.pick.unlock);
    return;
  }
  if (msg.hello){ MY_SEAT = msg.hello.seat; SEAT_COUNT = msg.hello.n; lobbyCard(); return; }
  if (msg.s) guestApply(msg.s, msg.u);
}
function linkDown(){
  if (!LINK.open) return;
  LINK.open = false;
  netNote = "the other keeper disconnected";
  toMenu();
}
function send(o){
  if (netMode === "host"){
    if (conns.length){ for (const e of conns){ try { e.conn.send(o); } catch {} } }
    else if (LINK.open){ try { LINK.send(o); } catch {} }   // paste-code host: one guest
    return;
  }
  if (LINK.open){ try { LINK.send(o); } catch {} }
}
function sendTo(entry, o){ try { entry.conn.send(o); } catch {} }

/* ---------- join codes ---------- */
const CODE_CHARS = "ACDEFGHJKMNPQRTUVWXY34679";   // no O/0, no I/1/L
const PEER_PREFIX = "saltline-v1-";
function makeCode(){
  let out = "";
  for (let i=0;i<4;i++) out += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
  return out;
}
function shareLink(code){
  if (location.protocol === "file:") return null;
  return location.origin + location.pathname + "#" + code;
}

function wirePeerConn(c){            // guest side: one connection, to the host
  conn = c;
  c.on("open",  () => linkUp(o => c.send(o), () => c.close()));
  c.on("data",  msg => linkData(msg));
  c.on("close", () => linkDown());
  c.on("error", () => linkDown());
}

function hostAccept(c){             // host side: one of these per guest
  if (state !== ST.NET && state !== ST.LOBBY){ try { c.close(); } catch {} return; }
  const entry = { conn:c, seat:0 };
  c.on("open", () => {
    if (conns.length + 1 >= MAX_SEATS){ try { c.close(); } catch {} return; }
    conns.push(entry);
    reseatLobby();
    LINK.open = true;
    state = ST.LOBBY;
    lobbyCard();
  });
  c.on("data",  msg => linkData(msg, entry.seat));
  c.on("close", () => hostDrop(entry));
  c.on("error", () => hostDrop(entry));
}

/* Seats are handed out in join order and only renumbered in the lobby, so a
   keeper's seat cannot shift under them once a match has started. */
function reseatLobby(){
  conns.forEach((e,i) => { e.seat = i + 1; });
  SEAT_COUNT = conns.length + 1;
  conns.forEach(e => sendTo(e, { hello:{ seat:e.seat, n:SEAT_COUNT } }));
}

function hostDrop(entry){
  const i = conns.indexOf(entry);
  if (i < 0) return;
  conns.splice(i, 1);
  if (state === ST.LOBBY || state === ST.NET){
    reseatLobby();
    if (state === ST.LOBBY) lobbyCard();
    return;
  }
  const p = game.players[entry.seat];            // mid-match: their lamp goes out
  if (p && p.alive){
    p.alive = false;
    game.burst(p.x, p.y, p.char.color, 30, 200);
  }
  if (!conns.length){ netNote = "the other keepers disconnected"; toMenu(); }
}

function hostOnline(attempt){
  netMode = "host"; state = ST.NET;
  netCardShell("Opening the tower", `<p>Reaching the meeting point…</p>`, "");
  loadPeerJS().then(ok => {
    if (netMode !== "host") return;
    if (!ok) return brokerUnreachable("host");
    const code = makeCode();
    peer = new Peer(PEER_PREFIX + code, brokerOptions());
    peer.on("open", () => { if (netMode === "host") hostCodeCard(code); });
    peer.on("connection", c => { if (netMode === "host") hostAccept(c); });
    peer.on("error", err => {
      if (netMode !== "host") return;
      if (err && err.type === "unavailable-id" && (attempt||0) < 5){
        try { peer.destroy(); } catch {}
        return hostOnline((attempt||0) + 1);       // that code was taken, take another
      }
      if (err && err.type === "peer-unavailable") return;
      brokerUnreachable("host");
    });
  });
}

function joinOnline(code){
  netMode = "guest"; state = ST.NET;
  netCardShell("Joining", `<p>Looking for tower <b>${code}</b>…</p>`, "");
  loadPeerJS().then(ok => {
    if (netMode !== "guest") return;
    if (!ok) return brokerUnreachable("guest");
    peer = new Peer(undefined, brokerOptions());
    peer.on("open", () => {
      if (netMode !== "guest") return;
      wirePeerConn(peer.connect(PEER_PREFIX + code, { reliable:false, serialization:"json" }));
      setTimeout(() => {
        if (netMode === "guest" && !LINK.open) joinCard(code, "no answer from " + code +
          " — check the code, and that they still have the tower open");
      }, 12000);
    });
    peer.on("error", err => {
      if (netMode !== "guest") return;
      if (err && err.type === "peer-unavailable")
        joinCard(code, "nobody is holding the code " + code);
      else brokerUnreachable("guest");
    });
  });
}

function brokerUnreachable(side){
  show(`<div class="kicker">Online duel</div>
    <h2>The meeting point is not answering</h2>
    <p>Join codes need one small public service to introduce the two browsers.
       It is either blocked on this network or temporarily down.</p>
    <p>You can still play online without it — the two browsers can introduce
       themselves by copy-paste instead. It takes one extra step each way.</p>
    <button ${BTNS} id="manual">USE PASTE CODES</button>
    <p class="hint">Press <kbd>Esc</kbd> to go back</p>`);
  const b = document.getElementById("manual");
  if (b) b.onclick = () => { netTeardown(); (side === "host" ? hostFlow : joinFlow)(); };
}

const CODE_BOX = `style="font:600 44px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.34em;color:#e8eef7;background:#0b131c;border:1px solid #24374b;border-radius:8px;

function hostCodeCard(code){
