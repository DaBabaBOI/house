/* ---------- paste codes: no broker involved at all ---------- */
function newPC(){
  const p = new RTCPeerConnection(ICE);
  p.onconnectionstatechange = () => {
    if (p.connectionState === "failed" || p.connectionState === "disconnected"){
      netNote = "connection lost";
      if (state !== ST.MENU) toMenu();
    }
  };
  return p;
}

function iceComplete(p){
  if (p.iceGatheringState === "complete") return Promise.resolve();
  return new Promise(res => {
    const done = () => { p.removeEventListener("icegatheringstatechange", check); res(); };
    const check = () => { if (p.iceGatheringState === "complete") done(); };
    p.addEventListener("icegatheringstatechange", check);
    setTimeout(done, 4000);            // good enough without trickle
  });
}

function wireChannel(){
  ch.binaryType = "arraybuffer";
  ch.onopen = () => linkUp(o => ch.send(JSON.stringify(o)), () => ch.close());
  ch.onclose = () => linkDown();
  ch.onmessage = ev => { try { linkData(JSON.parse(ev.data)); } catch {} };
}

function netCardShell(title, body, status){
  show(`<div class="kicker">Online duel</div><h2>${title}</h2>${body}
        <p class="hint" id="netstat">${status||""}</p>
        <p class="hint">Press <kbd>Esc</kbd> to go back</p>`);
}
const TA = `style="width:100%;height:110px;background:#0b131c;color:#cfe0f2;border:1px solid #24374b;
  border-radius:6px;padding:10px;font:500 11px/1.45 ui-monospace,monospace;resize:vertical"`;
const BTNS = `style="margin:10px 8px 0 0;background:#132131;color:#e8eef7;border:1px solid #2b3a4d;
  border-radius:6px;padding:9px 16px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.12em;cursor:pointer"`;

function setStat(t){ const el = document.getElementById("netstat"); if (el) el.textContent = t; }

async function hostFlow(){
  netMode = "host"; state = ST.NET;
  netCardShell("Hosting by paste code", `<p>Making your invitation code…</p>`, "gathering network routes");
  pc = newPC();
  ch = pc.createDataChannel("duel", { ordered:false, maxRetransmits:0 });
  wireChannel();
  await pc.setLocalDescription(await pc.createOffer());
  await iceComplete(pc);
  if (netMode !== "host") return;
  const code = enc({ t:pc.localDescription.type, s:pc.localDescription.sdp });

  netCardShell("Hosting — you hold the left seat", `
    <p><b>1.</b> Send this invitation code to the other keeper:</p>
    <textarea ${TA} id="mine" readonly>${code}</textarea>
    <button ${BTNS} id="copy">COPY CODE</button>
    <p style="margin-top:18px"><b>2.</b> Paste the reply code they send back:</p>
    <textarea ${TA} id="theirs" placeholder="their reply code"></textarea>
    <button ${BTNS} id="go">CONNECT</button>`, "waiting for their reply");

  document.getElementById("copy").onclick = () => {
    const t = document.getElementById("mine"); t.select();
    navigator.clipboard?.writeText(t.value).then(()=>setStat("code copied"), ()=>setStat("select and copy manually"));
  };
  document.getElementById("go").onclick = async () => {
    try {
      const a = dec(document.getElementById("theirs").value);
      await pc.setRemoteDescription({ type:a.t, sdp:a.s });
      setStat("connecting…");
    } catch(e){ setStat("that code could not be read — check it was copied whole"); }
  };
}

async function joinFlow(){
  netMode = "guest"; state = ST.NET;
  netCardShell("Joining by paste code", `
    <p><b>1.</b> Paste the host's invitation code:</p>
    <textarea ${TA} id="theirs" placeholder="their invitation code"></textarea>
    <button ${BTNS} id="go">GENERATE REPLY</button>`, "");

  pc = newPC();
  pc.ondatachannel = ev => { ch = ev.channel; wireChannel(); };

  document.getElementById("go").onclick = async () => {
    let offer;
    try { offer = dec(document.getElementById("theirs").value); }
    catch(e){ return setStat("that code could not be read — check it was copied whole"); }
    setStat("building reply…");
    await pc.setRemoteDescription({ type:offer.t, sdp:offer.s });
    await pc.setLocalDescription(await pc.createAnswer());
    await iceComplete(pc);
    if (netMode !== "guest") return;
    const code = enc({ t:pc.localDescription.type, s:pc.localDescription.sdp });
    netCardShell("Joining — you take the right seat", `
      <p><b>2.</b> Send this reply code back to the host, then wait:</p>
      <textarea ${TA} id="mine" readonly>${code}</textarea>
      <button ${BTNS} id="copy">COPY REPLY</button>`, "waiting for the host to connect");
    document.getElementById("copy").onclick = () => {
      const t = document.getElementById("mine"); t.select();
      navigator.clipboard?.writeText(t.value).then(()=>setStat("reply copied"), ()=>setStat("select and copy manually"));
    };
  };
}

const enc = o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/=+$/,"");
const dec = s => JSON.parse(new TextDecoder().decode(
  Uint8Array.from(atob(s.trim().replace(/\s+/g,"")), c => c.charCodeAt(0))));

function netTeardown(){
  LINK.open = false; LINK.send = () => {}; LINK.close = () => {};
  for (const e of conns){ try { e.conn.close(); } catch {} }
  conns = [];
  for (const k of Object.keys(remoteSeqs)) delete remoteSeqs[k];
  for (const k of Object.keys(remotePkts)) delete remotePkts[k];
  SEAT_COUNT = 2; MY_SEAT = 0;
  try { conn && conn.close(); } catch {}
  try { peer && peer.destroy(); } catch {}
  try { ch && ch.close(); } catch {}
  try { pc && pc.close(); } catch {}
  conn = peer = ch = pc = null;
  netMode = "local";
  localSeq = {f:0,p:0,d:0,s:0,c:0};
}

/* host: turn the guest's packet into one frame of input.
   Presses arrive as counters, so a dropped packet never eats a shot. */
function remoteInput(seat){
  seat = seat || 1;
  const pkt = remotePkts[seat] || (remotePkts[seat] = { a:[0,0], f:0, p:0, d:0, s:0, c:0 });
  const seen = remoteSeqs[seat] || (remoteSeqs[seat] = { f:0, p:0, d:0, s:0, c:0 });
  const i = blankInput();
  i.ax = pkt.a[0]; i.ay = pkt.a[1];
  for (const k of ["f","p","d","s","c"]){
    if (pkt[k] > seen[k]){
      seen[k]++;
      if (k==="f") i.fire = true;
      else if (k==="p"){ i.parry = true; i.back = true; }
      else if (k==="d") i.dash = true;
      else if (k==="s") i.special = true;
      else i.confirm = true;
    }
  }
  return i;
}

/* guest: sample the keyboard and bump a counter per press */
function guestSend(){
  const s = SCHEMES[0];
  let ax = 0, ay = 0;
  if (hasHeld(s.left)) ax -= 1; if (hasHeld(s.right)) ax += 1;
  if (hasHeld(s.up))   ay -= 1; if (hasHeld(s.down))  ay += 1;
  if (hasEdge(s.fire))    localSeq.f++;
  if (hasEdge(s.parry))   localSeq.p++;
  if (hasEdge(s.dash))    localSeq.d++;
  if (hasEdge(s.special)) localSeq.s++;
  if (hasEdge(s.fire) || edge.has("Enter")) localSeq.c++;
  send({ i:{ a:[ax,ay], f:localSeq.f, p:localSeq.p, d:localSeq.d, s:localSeq.s, c:localSeq.c } });
}

function guestApply(s, u){
  const wasAlive = game.players.map(p => p.alive);
  const nMotes = game.motes.length;
  const last = game.motes[nMotes-1];
  const lastPos = last ? {x:last.x, y:last.y} : null;

  game.applySnapshot(s);

  if (game.motes.length < nMotes && lastPos) game.burst(lastPos.x, lastPos.y, "#cfe6ff", 8);
  for (let i=0;i<2;i++) if (wasAlive[i] && !game.players[i].alive)
    game.burst(game.players[i].x, game.players[i].y, game.players[i].char.color, 46, 260);

  if (u.sel){ SELECT_STATE.cursor = u.sel.c; SELECT_STATE.locked = u.sel.l; }

  const key = JSON.stringify(u);
  if (key !== lastUiKey){
    lastUiKey = key;
    state = u.st;
    if (u.st === ST.CARD) isBR() ? royaleCard(u.r) : beatCard(u.i, u.r, seatNames());
    else if (u.st === ST.EPI) isBR() ? royaleChampionCard(u.w)
                                     : epilogueCard(u.w, game.scores, seatNames());
    else if (u.st === ST.LOBBY) lobbyCard();
    else if (u.st === ST.PLAY || u.st === ST.SELECT) hide();
    else if (u.st === ST.MENU) menuCard();
  }
}

/* ============================================================
   THE CPU
   It plays through exactly the struct a human keyboard fills:
   eight directions, one fire, one guard, one dash, one special.
   Three rules keep it honest —
     · it reads only what is drawn on the screen,
     · it aims in the same eight directions a keyboard can make,
     · it is deterministic, so the same position is answered the
       same way twice and can be learned instead of out-rolled.
   ============================================================ */
const CPU_LEVELS = [
  { id:"APPRENTICE", think:0.30, bounces:0, parryOdds:0.20, dashOdds:0.30,
    specialOdds:0.35, lead:0.0,  hesitate:0.40, keepAt:270, blindFire:0.34, lineUp:0.35 },
  { id:"KEEPER",     think:0.17, bounces:1, parryOdds:0.60, dashOdds:0.70,
    specialOdds:0.80, lead:0.55, hesitate:0.18, keepAt:285, blindFire:0.07, lineUp:1.1 },
  { id:"WARDEN",     think:0.085,bounces:2, parryOdds:0.93, dashOdds:0.95,
    specialOdds:1.00, lead:1.0,  hesitate:0.0,  keepAt:260, blindFire:0.0, lineUp:1.8 },
  // Reacts every frame, banks three walls, guards everything it can reach, and
  // will not stand anywhere a shot could already be on its way.
  { id:"TWO LIGHTS", think:1/60, bounces:3, parryOdds:1.00, dashOdds:1.00,
    specialOdds:1.00, lead:1.0,  hesitate:0.0,  keepAt:210, blindFire:0.0, lineUp:2.8,
    fineAim:true, sharpGuard:true, parryWindow:0.45 },
];

const CPU = { seats:[false,false], level:1, mem:[null,null], selT:[] };

const DIRS8 = (() => {
  const out = [];
  for (let i=0;i<8;i++){ const a = i*Math.PI/4; out.push([Math.cos(a), Math.sin(a)]); }
  return out;
})();

/* Levels one to three are held to eight directions, because that is all a
   keyboard can make. The fourth is not: it aims continuously, which no player
   can do, and the difficulty card says so plainly. */
const DIRS_FINE = (() => {
  const out = [];
  for (let i=0;i<72;i++){ const a = i*Math.PI/36; out.push([Math.cos(a), Math.sin(a)]); }
  return out;
})();
const cpuDirs = lvl => lvl.fineAim ? DIRS_FINE : DIRS8;

// Deterministic stand-in for a coin flip: the same situation always answers alike.
function hash01(x, y){
  let h = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Decorrelates the two seats without favouring either: the draw comes from
// this keeper's own position and the mote in front of it, never from which
// seat it happens to be sitting in.
function cpuDraw(p, a, b){
  return hash01(Math.round(p.x)*13 + (a|0), Math.round(p.y)*7 + (b|0) + CPU.level*101);
}

function cpuMem(){
  return { t:0, round:-1, dir:[0,0], fire:false, dash:false, special:false, parryTarget:0 };
}

function cpuBlocked(g, x, y, r){
  const b = g.bounds();
  if (x < b.x+r || x > b.x+b.w-r || y < b.y+r || y > b.y+b.h-r) return true;
  for (const w of g.obstacles){ if (resolveCircleRect({x,y}, w, r)) return true; }
  return false;
}

function cpuClearLine(g, from, to){
  const dx = to.x-from.x, dy = to.y-from.y, d = len(dx,dy) || 1;
  const stepX = dx/d*12, stepY = dy/d*12;
  let x = from.x, y = from.y;
  for (let i=0;i<d/12;i++){
    x += stepX; y += stepY;
    for (const w of g.obstacles){
      if (x > w.x && x < w.x+w.w && y > w.y && y < w.y+w.h) return false;
    }
  }
  return true;
}

/* Which motes would hit me if I stood perfectly still, and when. */
function cpuThreats(g, p, horizon){
  const list = [], step = 1/40;
  horizon = horizon || 1.4;
  for (const mo of g.motes){
    if (!mo.armed && mo.owner === p.idx) continue;       // inert in my own hands
    let x = mo.x, y = mo.y, vx = mo.vx, vy = mo.vy, t = 0;
    const r = mo.radius;
    while (t < horizon){
      x += vx*step; y += vy*step; t += step;
      const b = g.bounds();
      if (x < b.x+r){ x=b.x+r; vx=-vx; } else if (x > b.x+b.w-r){ x=b.x+b.w-r; vx=-vx; }
      if (y < b.y+r){ y=b.y+r; vy=-vy; } else if (y > b.y+b.h-r){ y=b.y+b.h-r; vy=-vy; }
      let eaten = false;
      for (const w of g.obstacles){
        const probe = {x,y}, axis = resolveCircleRect(probe, w, r);
        if (!axis) continue;
        x = probe.x; y = probe.y;
        if (w.void){ eaten = true; break; }
        if (axis === "x") vx = -vx; else vy = -vy;
      }
      if (eaten) break;
      if (len(x-p.x, y-p.y) <= p.st.radius + r + 8){ list.push({ id:mo.id, mote:mo, t, x, y }); break; }
    }
  }
  list.sort((a,b) => a.t - b.t);
  return list;
}

/* Is there a direction that puts a mote into them? Bank shots allowed
   by level. A line that comes back and kills me does not count. */
function cpuFindShot(g, p, foe, lvl){
  const st = p.st, step = 1/40, horizon = lvl.fineAim ? 3.6 : 2.8;
  let best = null;
  for (const [dx,dy] of cpuDirs(lvl)){
    const off = st.radius + st.moteRadius + 2, r = st.moteRadius;
    let x = p.x + dx*off, y = p.y + dy*off;
    let vx = dx*st.moteSpeed, vy = dy*st.moteSpeed;
    let t = 0, bounces = 0, hit = null, selfRisk = false;
    while (t < horizon){
      x += vx*step; y += vy*step; t += step;
      const b = g.bounds();
      let wall = false;
      if (x < b.x+r){ x=b.x+r; vx=-vx; wall=true; }
      else if (x > b.x+b.w-r){ x=b.x+b.w-r; vx=-vx; wall=true; }
      if (y < b.y+r){ y=b.y+r; vy=-vy; wall=true; }
      else if (y > b.y+b.h-r){ y=b.y+b.h-r; vy=-vy; wall=true; }
      let eaten = false;
      for (const w of g.obstacles){
        const probe = {x,y}, axis = resolveCircleRect(probe, w, r);
        if (!axis) continue;
        x = probe.x; y = probe.y;
        if (w.void){ eaten = true; break; }
        if (axis === "x") vx = -vx; else vy = -vy;
        wall = true;
      }
      if (eaten) break;
      if (wall && ++bounces > lvl.bounces) break;
      const lt = Math.min(t, 0.5) * lvl.lead;              // lead the target
      const fx = foe.x + foe.vx*lt, fy = foe.y + foe.vy*lt;
      if (len(x-fx, y-fy) <= foe.st.radius + r + 2){ hit = {t, bounces}; break; }
      if (bounces >= 1 && len(x-p.x, y-p.y) <= st.radius + r + 8){ selfRisk = true; break; }
    }
    if (hit && !selfRisk){
      const score = hit.t + hit.bounces*0.3 - (dx*p.fx + dy*p.fy)*0.004;
      if (!best || score < best.score) best = { dir:[dx,dy], score };
    }
  }
  return best;
}

/* Face the incoming mote, but angled as far toward the sender as the
   guard arc allows — a parry returns along your facing. */
function cpuParryFace(p, foe, threat, lvl){
  const toMote = Math.atan2(threat.mote.y - p.y, threat.mote.x - p.x);
  const toFoe  = Math.atan2(foe.y - p.y, foe.x - p.x);
  const limit  = p.st.parryArc/2 - 0.10;
  if (lvl && lvl.fineAim){          // point it exactly back down their throat
    let d = Math.atan2(Math.sin(toFoe-toMote), Math.cos(toFoe-toMote));
    const a = toMote + clamp(d, -limit, limit);
    return [Math.cos(a), Math.sin(a)];
  }
  let best = null;
  for (const [dx,dy] of DIRS8){
    const a  = Math.atan2(dy,dx);
    const dm = Math.abs(Math.atan2(Math.sin(a-toMote), Math.cos(a-toMote)));
    if (dm > limit) continue;
    const df = Math.abs(Math.atan2(Math.sin(a-toFoe), Math.cos(a-toFoe)))
             - (dx*p.fx + dy*p.fy)*0.001;
    if (!best || df < best.df) best = { dir:[dx,dy], df };
  }
  if (best) return best.dir;
  const a = Math.round(toMote / (Math.PI/4)) & 7;
  return DIRS8[a];
}

function cpuEscape(g, p, threats){
  let best = null;
  for (const [dx,dy] of DIRS8){
    const px = p.x + dx*p.st.maxSpeed*0.32, py = p.y + dy*p.st.maxSpeed*0.32;
    if (cpuBlocked(g, px, py, p.st.radius)) continue;
    let score = 1e9;
    for (const t of threats) score = Math.min(score, len(px-t.x, py-t.y));
    score += (dx*p.fx + dy*p.fy) * 0.5;
    for (const mo of g.motes){
      if (!mo.armed && mo.owner === p.idx) continue;
      score = Math.min(score, len(px-mo.x, py-mo.y) + 40);
    }
    const b = g.bounds();
    score += Math.min(px-b.x, b.x+b.w-px, py-b.y, b.y+b.h-py) * 0.3;
    if (!best || score > best.score) best = { dir:[dx,dy], score };
  }
  return best ? best.dir : [0,0];
}

/* Aim is welded to movement and a keyboard only makes eight of them, so a
   shot exists only from the lines that run through the other keeper. This
   finds the nearest such line and says which way to step onto it — the
   lining-up that a player does without thinking about it. */
function cpuAimLine(g, p, foe, lvl){
  let best = null;
  for (const [dx,dy] of (lvl && lvl.fineAim ? DIRS_FINE : DIRS8)){
    const vx = p.x - foe.x, vy = p.y - foe.y;
    const along = vx*dx + vy*dy;
    if (along > -70) continue;                 // must sit back along the line, not past them
    const perpX = vx - along*dx, perpY = vy - along*dy;
    const perp = len(perpX, perpY);
    if (perp > 520) continue;
    if (!best || perp < best.perp) best = { perp, px:perpX, py:perpY, dir:[dx,dy] };
  }
  if (!best || best.perp < 1) return null;
  return { ux:-best.px/best.perp, uy:-best.py/best.perp, perp:best.perp };
}

function cpuRoam(g, p, foe, threats, lvl){
  const b = g.bounds();
  const aim = cpuAimLine(g, p, foe, lvl);
  const circle = Math.atan2(foe.y-p.y, foe.x-p.x)
               + (Math.floor(g.time/1.7) % 2 ? 1 : -1) * Math.PI/2;
  let best = null;
  for (const [dx,dy] of DIRS8){
    const px = p.x + dx*p.st.maxSpeed*0.35, py = p.y + dy*p.st.maxSpeed*0.35;
    if (cpuBlocked(g, px, py, p.st.radius)) continue;
    let score = -Math.abs(len(foe.x-px, foe.y-py) - lvl.keepAt) * 0.02;
    for (const t of threats) score -= Math.max(0, 170 - len(px-t.x, py-t.y)) * 0.04;
    for (const mo of g.motes){
      if (!mo.armed && mo.owner === p.idx) continue;
      score -= Math.max(0, 95 - len(px-mo.x, py-mo.y)) * 0.06;
    }
    score += Math.min(px-b.x, b.x+b.w-px, py-b.y, b.y+b.h-py) * 0.03;
    score += (dx*Math.cos(circle) + dy*Math.sin(circle)) * 0.5;
    score += (dx*p.fx + dy*p.fy) * 0.04;
    if (aim) score += (dx*aim.ux + dy*aim.uy) * (lvl.lineUp || 1.0);
    if (lvl.wary){
      // stand nowhere a keeper already has a clean line to you
      for (const q of g.players){
        if (q.idx === p.idx || !q.alive) continue;
        if (cpuClearLine(g, q, {x:px, y:py})) score -= 2.6;
      }
    }
    if (!best || score > best.score) best = { dir:[dx,dy], score };
  }
  return best ? best.dir : [0,0];
}

/* One rule per keeper — each special is spent where it actually pays. */
function cpuSpecialWanted(g, p, foe, lvl, worst, shot){
  if (!p.ready) return false;
  if (cpuDraw(p, Math.round(g.time*4)*31, 5) > lvl.specialOdds) return false;
  const dFoe = len(foe.x-p.x, foe.y-p.y);
  switch (p.char.id){
    case "ines":  return !!shot || (p.ammo === 0 && dFoe < 430);
    case "cato":  return !!worst && worst.t < 0.30 && p.dashCd > 0;
    case "meran": return !!shot && !p.primed && p.ammo > 0;
    case "odall": return !worst && dFoe < 500 && cpuClearLine(g, foe, p);
    case "silt":  return !!worst && worst.t < 0.22 && p.parryCd > 0;
    case "vane":  return g.motes.some(mo => mo.owner === p.idx && mo.armed &&
                         len(mo.x-foe.x, mo.y-foe.y) < 280 &&
                         (mo.x-foe.x)*mo.vx + (mo.y-foe.y)*mo.vy > 0);
    case "keel":  return !!worst && worst.t < 0.5;
    case "auger": return !!worst && worst.t > 0.25 && worst.t < 0.9;
  }
  return false;
}

function cpuFace(p, target){
  const a = Math.atan2(target.y - p.y, target.x - p.x);
  return DIRS8[(Math.round(a / (Math.PI/4)) & 7)];
}

/* The deliberate part: runs on the level's reaction clock, not every frame. */
function cpuFoe(g, seat){
  const me = g.players[seat];
  let best = null, bd = 1e9;
  for (const q of g.players){
    if (q.idx === seat || !q.alive) continue;
    const d = len(q.x-me.x, q.y-me.y);
    if (d < bd){ bd = d; best = q; }
  }
  return best;
}

function cpuPlan(g, seat, lvl, m){
  const p = g.players[seat], foe = cpuFoe(g, seat);
  m.parryTarget = 0;
  if (!p.alive || !foe || g.result){ m.dir = [0,0]; return; }

  const threats = cpuThreats(g, p, lvl.fineAim ? 1.9 : 1.4);
  const worst = threats[0];
  const shot = (p.fireCd <= 0 && p.ammo > 0) ? cpuFindShot(g, p, foe, lvl) : null;
  const wantSpecial = cpuSpecialWanted(g, p, foe, lvl, worst, shot);

  // Specials that need to be aimed somewhere specific go first.
  if (wantSpecial && (p.char.id === "odall" || p.char.id === "auger")){
    m.special = true;
    m.dir = cpuFace(p, p.char.id === "odall" ? foe : (worst || foe));
    return;
  }
  if (wantSpecial && (p.char.id === "cato" || p.char.id === "silt" || p.char.id === "keel" ||
                      p.char.id === "vane" || p.char.id === "meran")){
    m.special = true;
    if (p.char.id === "meran" && shot) m.dir = shot.dir;
    else m.dir = worst ? cpuEscape(g, p, threats) : m.dir;
    if (p.char.id !== "meran") return;
  }

  // Commit to a parry — the press itself is timed frame by frame below.
  if (worst && worst.t < (lvl.parryWindow || 0.55) && p.parryCd <= 0 && p.ghost <= 0 &&
      cpuDraw(p, worst.id*17, 11) < lvl.parryOdds){
    m.parryTarget = worst.id;
    m.dir = cpuParryFace(p, foe, worst, lvl);
    return;
  }

  // Otherwise get out of the way.
  if (worst && worst.t < 0.42){
    m.dir = cpuEscape(g, p, threats);
    if (p.dashCd <= 0 && worst.t < 0.26 && cpuDraw(p, worst.id*29, 23) < lvl.dashOdds) m.dash = true;
    return;
  }

  // Or take the shot, if there is one and the hands are steady.
  if (shot){
    const jitter = cpuDraw(p, Math.round(g.time*30)*3, 37);
    if (jitter >= lvl.hesitate){
      m.dir = shot.dir;
      if (p.char.id === "ines" && wantSpecial) m.special = true; else m.fire = true;
      return;
    }
  }
  if (p.fireCd <= 0 && p.ammo > 0 && lvl.blindFire > 0 &&
      cpuDraw(p, Math.round(g.time*7)*41, 53) < lvl.blindFire){
    m.dir = cpuFace(p, foe);
    m.fire = true;
    return;
  }
  m.dir = cpuRoam(g, p, foe, threats, lvl);
}

/* Called every frame: holds the plan, and times the guard press itself. */
function cpuInput(g, seat, dt){
  let m = CPU.mem[seat];
  if (!m || m.round !== g.round){ m = CPU.mem[seat] = cpuMem(); m.round = g.round; }
  const lvl = CPU_LEVELS[CPU.level];

  m.t -= dt;
  if (m.t <= 0){ m.t = lvl.think; cpuPlan(g, seat, lvl, m); }

  const i = blankInput();
  i.ax = m.dir[0]; i.ay = m.dir[1];
  i.fire = m.fire; i.dash = m.dash; i.special = m.special;
  m.fire = m.dash = m.special = false;              // an edge lasts one frame

  if (m.parryTarget){
    const p = g.players[seat];
    const mo = g.motes.find(x => x.id === m.parryTarget);
    if (!mo || !p.alive) m.parryTarget = 0;
    else {
      const d = len(mo.x - p.x, mo.y - p.y);
      const closing = d / (len(mo.vx, mo.vy) || 1);
      const window = lvl.sharpGuard ? 0.035 : 0.055;
      if (closing <= window || d <= p.st.parryReach*0.8){ i.parry = true; m.parryTarget = 0; }
    }
  }
  return i;
}

/* The CPU answers your pick on the select screen, then locks its own. */
const CPU_COUNTER = { ines:"keel", cato:"auger", meran:"odall", odall:"silt",
                      silt:"vane", vane:"meran", keel:"cato", auger:"ines" };

function cpuSelectInput(seat){
  const i = blankInput();
  if (!SELECT_STATE.locked[0]) return i;             // let the player commit first
  const now = performance.now();
  if (now < (CPU.selT[seat] || 0)) return i;         // each keeper has its own clock, so
  CPU.selT[seat] = now + 240;                        // they choose at the same time

  const target = Math.max(0, CHARS.findIndex(c =>
    c.id === CPU_COUNTER[CHARS[SELECT_STATE.cursor[0]].id]) + (seat - 1)) % CHARS.length;
  const cur = SELECT_STATE.cursor[seat];
  if (cur === target){ i.fire = true; return i; }

  const cc = cur % SEL_COLS, cr = Math.floor(cur / SEL_COLS);
  const tc = target % SEL_COLS, tr = Math.floor(target / SEL_COLS);
  if (cc !== tc) i.ax = Math.sign(tc - cc); else i.ay = Math.sign(tr - cr);
  return i;
}

/* ============================================================
   STATE MACHINE
   ============================================================ */
const ST = { MENU:0, NET:1, SELECT:2, CARD:3, PLAY:4, EPI:5, DIFF:6, COUNT:7, LOBBY:8 };
let state = ST.MENU;
let game = new Game();
let cardIdx = 0, resultLine = "", epiWinner = 0, pendingSeats = 2;

function seatNames(){ return game.players.map(p => p.char); }

function uiPacket(){
  return { st:state, i:cardIdx, r:resultLine, w:epiWinner,
           sel:{ c:SELECT_STATE.cursor, l:SELECT_STATE.locked } };
}

function toMenu(){
  state = ST.MENU; lastUiKey = "";
  CPU.seats = [false,false]; CPU.mem = []; SEAT_COUNT = 2; pendingSeats = 2;
  game = new Game();
  netTeardown();
  menuCard();
  if (netNote){ const el = document.querySelector(".kicker"); if (el) el.textContent = netNote; netNote = ""; }
}

function startSelect(){
  SELECT_STATE = { cursor:DEFAULT_PICKS.slice(0, SEAT_COUNT),
                   locked:new Array(SEAT_COUNT).fill(false),
                   lastAx:new Array(SEAT_COUNT).fill(0),
                   lastAy:new Array(SEAT_COUNT).fill(0) };
  state = ST.SELECT;
  hide();
}

function stepSelect(inputs){
  for (let s=0;s<SEAT_COUNT;s++){
    const inp = inputs[s];
    if (SELECT_STATE.locked[s]){
      if (inp.back) SELECT_STATE.locked[s] = false;     // guard takes your pick back
      continue;
    }
    // move one card per press, not one per frame
    const ax = Math.sign(inp.ax), ay = Math.sign(inp.ay);
    let i = SELECT_STATE.cursor[s];
    if (ax !== 0 && ax !== SELECT_STATE.lastAx[s]){
      const col = i % SEL_COLS, row = Math.floor(i / SEL_COLS);
      i = row*SEL_COLS + (col + ax + SEL_COLS) % SEL_COLS;
    }
    if (ay !== 0 && ay !== SELECT_STATE.lastAy[s]){
      const rows = Math.ceil(CHARS.length / SEL_COLS);
      const col = i % SEL_COLS, row = Math.floor(i / SEL_COLS);
      i = ((row + ay + rows) % rows)*SEL_COLS + col;
    }
    SELECT_STATE.cursor[s] = clamp(i, 0, CHARS.length-1);
    SELECT_STATE.lastAx[s] = ax; SELECT_STATE.lastAy[s] = ay;
    if (inp.fire) SELECT_STATE.locked[s] = true;
  }
  if (SELECT_STATE.locked.slice(0, SEAT_COUNT).every(Boolean)) beginMatch();
}

function beginMatch(){
  game = new Game(SELECT_STATE.cursor.slice(0, SEAT_COUNT));
  cardIdx = 0; resultLine = "";
  state = ST.CARD;
  if (isBR()) royaleCard(""); else beatCard(0, "", seatNames());
}

function beginRound(){
  game.loadRound(cardIdx);
  camReset(game);
  state = ST.PLAY;
  hide();
}

function endOfRound(){
  const w = game.result.winner;
  const need = isBR() ? WINS_BR : WINS_NEEDED;
  if (w === -1){                                   // every lamp out: nobody profits
    resultLine = "Simultaneous — the round is void";
    beginRound();
    return;
  }
  if (game.scores[w] >= need){
    epiWinner = w; state = ST.EPI;
    if (isBR()) royaleChampionCard(w); else epilogueCard(w, game.scores, seatNames());
    return;
  }
  cardIdx++;
  state = ST.CARD;
  if (isBR()){
    resultLine = `${game.players[w].char.name} is the last lamp burning`;
    royaleCard(resultLine);
  } else {
    resultLine = `${game.players[w].char.name} takes the round, ` +
                 `${ROUND_FLAVOR[Math.min(cardIdx-1, ROUND_FLAVOR.length-1)]}` +
                 ` — ${game.scores[0]}–${game.scores[1]}`;
    beatCard(cardIdx, resultLine, seatNames());
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const FIXED = 1/120;
let acc = 0, last = performance.now();

function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, (now - last)/1000); last = now;

  if (edge.has("Escape") && state !== ST.MENU){ netNote = ""; toMenu(); edge.clear(); return; }

  if (netMode === "guest"){
    guestSend();
    game.stepSparks(dt);
    if (state === ST.PLAY){ updateCamera(game, dt);
      render(game, { netLabel:"ONLINE — you are seat " + (MY_SEAT+1) }); }
    else if (state === ST.SELECT)
      renderSelect(SELECT_STATE, { selHint:"you are seat " + (MY_SEAT+1) + " — everyone picks their own" });
    edge.clear();
    return;
  }

  const gather = select => {
    const out = [];
    for (let s=0; s<SEAT_COUNT; s++){
      if (netMode === "host" && s > 0) out.push(remoteInput(s));
      else if (CPU.seats[s]) out.push(select ? cpuSelectInput(s) : cpuInput(game, s, dt));
      else if (s <= 1) out.push(readInput(s));
      else out.push(blankInput());
    }
    return out;
  };
  const seatInputs = () => gather(false);

  switch (state){
    case ST.MENU:
    case ST.COUNT:
    case ST.DIFF:
      menuNav();
      break;

    case ST.LOBBY:
      if (netMode === "host" && (edge.has("Enter") || edge.has("Space"))) startSelect();
      break;

    case ST.NET:
      break;

    case ST.SELECT: {
      stepSelect(gather(true));
      if (state === ST.SELECT)
        renderSelect(SELECT_STATE, { selHint: netMode === "host"
          ? "you hold the left seat — they choose for themselves"
          : CPU.seats[1] ? "take your mirror — the tower answers with its own"
          : "player one on W A S D, player two on the arrows" });
      break;
    }

    case ST.CARD: {
      const go = netMode === "host" ? (anyConfirm() || remoteInput().confirm) : anyConfirm();
      if (go) beginRound();
      break;
    }

    case ST.PLAY: {
      const inputs = seatInputs();
      acc += dt;
      let first = true;
      while (acc >= FIXED){
        game.step(FIXED, inputs);
        acc -= FIXED;
        if (first){                       // a press fires once, not once per substep
          for (const i of inputs){ i.fire = i.parry = i.dash = i.special = false; }
          first = false;
        }
      }
      updateCamera(game, dt);
      render(game, { netLabel: netMode === "host" ? "ONLINE — you hold the left seat" : "" });
      if (game.result && game.overTimer > 1.8) endOfRound();
      break;
    }

    case ST.EPI:
      if (netMode === "host" ? (anyConfirm() || remoteInput().confirm) : anyConfirm()) startSelect();
      break;
  }

  if (netMode === "host") send({ s:game.snapshot(), u:uiPacket() });
  edge.clear();
}

menuCard();
const linkCode = (location.hash || "").replace(/^#/,"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
if (linkCode.length === 4) joinOnline(linkCode);
requestAnimationFrame(tick);
</script>
